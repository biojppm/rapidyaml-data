easyvr3:
  <<: *_on_separate_thread
  device: /dev/ttyUSB0
  baudrate: 9600  # valid: 9600 (default), 19200, 38700, 57600, 115200
  command_timeout: 5 # word recognition will timeout after these (integer) seconds
  sd_strictness_level: 1 # Speaker-dependent strictness control setting (1-5): 1 = easy2 = default5 = hardA higher setting will result in more recognition errors.
  mic_distance_level: 2 # Microphone Distance settings (1-3):1= "headset" (around 5cm from speaker's mouth)2 = "arm’s length" (defaultsetting, from about 50cm to 1m)3= "far mic" (up to around 3m
  lang: 4 # 0=English 1=Italian 2=Japanese 3=German 4=Spanish 5=French
  command_group: 3 # group where the commands are recognized
  response_wait: 0.01 # (s) short delay between sending serial commands and reading from buffer
  use_trigger: 0 # whether to enable trigger word
  

pysr:
  <<: *_on_separate_thread
  mode: google_cloud   # one of sphynx, google, google_cloud
  # the following settings come from the speech_recognition package:
  # https://github.com/Uberi/speech_recognition/blob/master/reference/library-reference.rst
  energy_threshold: 300   # float
  #^^^^^^^^^^^^^^^^
  # Represents the energy level threshold for sounds. Values below this
  # threshold are considered silence, and values above this threshold are
  # considered speech. Can be changed.
  # This is adjusted automatically if dynamic thresholds are enabled (see
  # recognizer_instance.dynamic_energy_threshold). A good starting value
  # will generally allow the automatic adjustment to reach a good value
  # faster.
  # This threshold is associated with the perceived loudness of the
  # sound, but it is a nonlinear relationship. The actual energy
  # threshold you will need depends on your microphone sensitivity or
  # audio data. Typical values for a silent room are 0 to 100, and
  # typical values for speaking are between 150 and 3500. Ambient
  # (non-speaking) noise has a significant impact on what values will
  # work best.
  # If you're having trouble with the recognizer trying to recognize
  # words even when you're not speaking, try tweaking this to a higher
  # value. If you're having trouble with the recognizer not recognizing
  # your words when you are speaking, try tweaking this to a lower
  # value. For example, a sensitive microphone or microphones in louder
  # rooms might have a ambient energy level of up to 4000.
  # The dynamic energy threshold setting can mitigate this by increasing
  # or decreasing this automatically to account for ambient
  # noise. However, this takes time to adjust, so it is still possible to
  # get the false positive detections before the threshold settles into a
  # good value.
  # To avoid this, use
  # recognizer_instance.adjust_for_ambient_noise(source, duration = 1) to
  # calibrate the level to a good value. Alternatively, simply set this
  # property to a high value initially (4000 works well), so the
  # threshold is always above ambient noise levels: over time, it will be
  # automatically decreased to account for ambient noise levels.
  dynamic_energy_threshold: 1   # bool
  #^^^^^^^^^^^^^^^^^^^^^^^^
  # Represents whether the energy level threshold (see
  # recognizer_instance.energy_threshold) for sounds should be
  # automatically adjusted based on the currently ambient noise level
  # while listening. Can be changed.
  # Recommended for situations where the ambient noise level is
  # unpredictable, which seems to be the majority of use cases. If the
  # ambient noise level is strictly controlled, better results might be
  # achieved by setting this to False to turn it off.
  dynamic_energy_adjustment_damping: 0.15    # float
  #^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
  # If the dynamic energy threshold setting is enabled (see
  # recognizer_instance.dynamic_energy_threshold), represents
  # approximately the fraction of the current energy threshold that is
  # retained after one second of dynamic threshold adjustment. Can be
  # changed (not recommended).
  # Lower values allow for faster adjustment, but also make it more
  # likely to miss certain phrases (especially those with slowly changing
  # volume). This value should be between 0 and 1. As this value
  # approaches 1, dynamic adjustment has less of an effect over
  # time. When this value is 1, dynamic adjustment has no effect.
  dynamic_energy_adjustment_ratio: 1.5   # type: float
  #^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
  # If the dynamic energy threshold setting is enabled (see
  # recognizer_instance.dynamic_energy_threshold), represents the minimum
  # factor by which speech is louder than ambient noise. Can be changed
  # (not recommended).
  # For example, the default value of 1.5 means that speech is at least
  # 1.5 times louder than ambient noise. Smaller values result in more
  # false positives (but fewer false negatives) when ambient noise is
  # loud compared to speech.
  pause_threshold: 0.8     # type: float
  #^^^^^^^^^^^^^^^
  # Represents the minimum length of silence (in seconds) that will
  # register as the end of a phrase. Can be changed.
  # Smaller values result in the recognition completing more quickly, but
  # might result in slower speakers being cut off.

speech:
  <<: *_on_separate_thread
  lang: pt # will be used as pt-PT
  active: 0
  inactive_sleep: 1.0 # seconds to sleep when the speech thread is inactive
  easyvr3_active: 1
  dialogflow_active: 0


#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
# high level states: specify a combination of low-level states and what
# conditions should be met to change to another high-level state

# diagram of basic locomotion states and transitions:
# https://docs.google.com/drawings/d/184IciZmwBQCR_3Sw4Le8mXeWoNyzyfXA5crCIKQ9XEU/edit?usp=sharing

states:

  ## =========================== "NORMAL" STATES ===========================

  ## <tr> sensor inputs and behaviours disabled for demo
  sleeping: &sleeping # defines a named anchor for inheriting
    eyes: slit
    head: sleeping
    legs: lying
    tail: down
    ears: down
    low_battery: shutdown
    servos: {disable: all} # must be either a servo name or a servo group name. Can also be a sequence.
    out:   # possible transitions for getting __out__ of this state
      sleeping2lying: # this is the destination high level state
        # the "sensors" member is needed only if there are other members here;
        # otherwise the transition is understood to be the "sensors" member
        sensors:
          gamepad: start
          speech: any # if the robot hears any speech, it will trigger this transition
          touch: down
          ## distance: {gt: 21, lt: 30} # wake up when the reported distance in cm is between these values
      lying2sit:
        ## defaults to the sensors member as explained above
        gamepad: l1+start
        speech: sit
        ## distance: {lt: 20}

  sleeping2lying: &sleeping2lying # this is a transition state, needed because the animations take time.
    <<: *sleeping  # inherit everything from "sleeping"
    eyes: blink_twice_slit_fluffy
    head: wake_up
    servos: {enable: head} # all servos not in the head group are disabled
    out: {} # no outward transitions; robot is "rogue" until it reaches the sitting state
    dst: lying # this member marks the destination state after the transition is complete

  lying: &lying
    <<: *sleeping2lying
    dst: "" # clear this, it was inherited from wake_up
    behave: [lookat] #[lookat, listen]
    head: awake
    eyes: fluffy
    low_battery: lying2sleep
    out:
      #lying_look_right: {gamepad: right}
      #lying_look_left: {gamepad: left}
      lying2sleep:
        speech: [sleep, down]
        gamepad: b
        timer: 60
      lying2sit:
        gamepad: start
        speech: sit
        #{ speech: any, gamepad: start, touch: down } # defaults to the sensors member as explained above
      lying2stand:
        gamepad: l1+start
        speech: up
      auto_lying2stand: {gamepad: select, speech: walk} # TODO add explore intent to speech  
      lying_touch: {gamepad: x, touch: down}

# <tr> not sure what these states are/were for
#  lying_look_right: &lying_look_right
#    <<: *lying
#    head: look_right
#
#  lying_look_left: &lying_look_left
#    <<: *lying
#    head: look_left

  lying2sleep: {<<: *lying, eyes: cool, head: sleep, dst: sleeping} # TRANSITION STATE
  lying2sit:   {<<: *lying, eyes: cool, head: lying2sit, legs: lying2sit, dst: sitting} # TRANSITION STATE
  lying2stand: &lying2stand {<<: *lying, eyes: cool, head: {state: stand2lying, reverse: 1}, legs: {state: stand2lying, reverse: 1}, dst: standing} # TRANSITION STATE

  sitting: &sitting
    <<: *lying
    head: awake_sitting
    eyes: normal
    ears: down
    legs: sitting
    tail: up
    low_battery: sit2lying
    servos: {enable: [head, legs]}
    out: # <tr> will this override the transitions inherited from *lying?
      sit2lying: {gamepad: b, speech: down, timer: 60}
      sit2stand: {gamepad: start, speech: up}
      auto_sit2stand: {gamepad: select, speech: walk} # TODO add explore intent to speech
      # demo states:
      sitting_touch: {gamepad: x, touch: down}
      #sitting_sound: {gamepad: y}
      #sit2stand_dist: {gamepad: select}
      #sitting_camera: {gamepad: a}
      #sitting_ovation: {gamepad: y}

  standing: &standing
    <<: *lying
    legs: standing
    ears: down
    tail: up
    servos: {enable: all}
    low_battery: sitting
    out:
      stand2lying:      {gamepad: l1+b  , speech: sleep}
      stand2sit:        {gamepad: b     , speech: [sit, down], timer: 30}
      stand2walk:       {gamepad: up   }
      stand2walk_back:  {gamepad: down }
      stand2turn_left:  {gamepad: left }
      stand2turn_right: {gamepad: right}
      standing_touch:   {gamepad: x, touch: down}
      auto_standing:    {gamepad: start , speech: walk} # TODO add explore intent to speech
      auto_walking_backwards: {gamepad: r1+down, speech: back}

  sit2lying: &sit2lying      {<<: *sitting , behave: [], eyes: cool, head: {state: lying2sit, reverse: 1}, legs: {state: lying2sit, reverse: 1}, dst: lying}    # TRANSITION STATE
  sit2stand: &sit2stand      {<<: *sitting , behave: [], eyes: cool, head: {state: stand2sit, reverse: 1}, legs: {state: stand2sit, reverse: 1}, dst: standing}    # TRANSITION STATE
  stand2sit: &stand2sit      {<<: *standing, behave: [], eyes: cool, head: {state: stand2sit}, legs: stand2sit  , dst: sitting}   # TRANSITION STATE
  stand2lying: &stand2lying  {<<: *standing, behave: [], eyes: cool, head: {state: stand2lying}, legs: stand2lying, dst: lying}  # TRANSITION STATE

  stand2walk: &stand2walk             {<<: *standing, behave: [], eyes: cool, legs: stand2walk , dst: walking}  # TRANSITION STATE
  stand2walk_back: &stand2walk_back   {<<: *standing, behave: [], eyes: cool, legs: stand2walk , dst: walking_backwards}  # TRANSITION STATE
  stand2turn_left: &stand2turn_left   {<<: *standing, behave: [], eyes: cool, legs: stand2turn , dst: turning_left}  # TRANSITION STATE
  stand2turn_right: &stand2turn_right {<<: *standing, behave: [], eyes: cool, legs: stand2turn , dst: turning_right}  # TRANSITION STATE

  walking: &walking
    <<: *standing
    legs: {state: walk, loop: 1, speed: 1}
    behave: []
    out:
      walk2stand:
        sensors: &stop_walking
          gamepad: b
          #speech: stop
          #touch: down
          #distance: {lt: 20}
        # send to different states according to the current closest frame in the leg animation
        choose_dst: {legs: {closest_frame: {0: walk2stand, 6: walk2stand_mirror}}}
      #standing_look_vleft: {gamepad: start}

  walking_backwards: &walking_backwards
    <<: *walking
    legs: {state: walk_backwards, reverse: 0, loop: 1, speed: 0.65}
    out:
      walk2stand:
        sensors:
          <<: *stop_walking
        choose_dst: {legs: {closest_frame: {11: walk2stand, 5: walk2stand_mirror}}}
      #standing_look_vleft: {gamepad: start}

#<tr> not sure what these states are/were for
#  walking_tail_wagging:
#    <<: *walking
#    tail: {state: wag_loop, loop: 1, speed: 1.}
#
#  walking_backwards_tail_wagging:
#    <<: *walking_backwards
#    tail: {state: wag_loop, loop: 1, speed: 0.8}

  walk2stand: &walk2stand               {<<: *standing, behave: [], eyes: fluffy, legs: {state: stand2walk_rev       , reverse: 0}, dst: standing}    # TRANSITION STATE
  walk2stand_mirror: &walk2stand_mirror {<<: *standing, behave: [], eyes: fluffy, legs: {state: stand2walk_rev_mirror, reverse: 0}, dst: standing}    # TRANSITION STATE

  turning_left: &turning_left
    <<: *standing
    legs: {state: turn, loop: 1, speed: 0.65}
    behave: []
    out:
      turn2stand:
        sensors:
          gamepad: b
          speech: stop
        # constrain the transition to occur only at this frame
        exit_frame: {legs: 0}

  turning_right: &turning_right
    <<: *turning_left
    legs: {state: turn, reverse: 1, loop: 1, speed: 0.65}

  turn2stand: {<<: *turning_left, behave: [], legs: {state: stand2turn, reverse: 1}, dst: standing}


  ## ========================== AUTONOMOUS MODE ==========================

  auto_sit2stand: {<<: *sit2stand , dst: auto_standing}
  auto_lying2stand: {<<: *lying2stand, dst: auto_standing} # TRANSITION STATE

  auto_standing: &auto_standing
    <<: *standing
    behave: []
    low_battery: stand2sit
    out:
      auto_look_left: {distance: {<<: *_dist_not_far}}
      #auto_look_right: {distance: {<<: *_dist_not_far}} # until we implement some randomness, trusty always looks left first
      auto_stand2walk: {distance: {<<: *_dist_far}}
      stand2sit: {gamepad: b, timer: 10.0}
      standing: {speech: [stop, down]}

  auto_walking: &auto_walking
    <<: *auto_standing
    legs: {state: walk, loop: 1, speed: 1.2}
    out:
      auto_walk2stand:
        sensors:
          distance: {<<: *_dist_close}
        choose_dst: {legs: {closest_frame: {0: auto_walk2stand, 6: auto_walk2stand_mirror}}}
      walk2stand:
        sensors: {gamepad: b, timer: 30.0, touch: down, speech: [stop, down]}
        choose_dst: {legs: {closest_frame: {0: walk2stand, 6: walk2stand_mirror}}}
  
  auto_walking_backwards: &auto_walking_backwards
    <<: *auto_walking
    legs: {state: walk_backwards, reverse: 0, loop: 1, speed: 0.65}
    out:
      # <tr> walking backwards will always exit autonomous mode. for now.
      # auto_walk2stand:
      #   sensors:
      #     distance: {<<: *_dist_far}
      #   choose_dst: {legs: {closest_frame: {0: auto_walk2stand, 6: auto_walk2stand_mirror}}}
      walk2stand:
        sensors: {gamepad: b, timer: 15.0, speech: stop}
        choose_dst: {legs: {closest_frame: {0: walk2stand, 6: walk2stand_mirror}}}        

  auto_stand2walk: &auto_stand2walk {<<: *stand2walk, dst: auto_walking}  # TRANSITION STATE

  auto_walk2stand:        {<<: *walk2stand, dst: auto_standing}
  auto_walk2stand_mirror: {<<: *walk2stand_mirror, dst: auto_standing}

  auto_look_left: {<<: *auto_standing, head: check_left, dst: auto_check_left}
  auto_check_left:
    <<: *auto_standing
    head: look_vleft
    out:
      auto_stand2turn_left_90: {distance: {<<: *_dist_far}}
      auto_look_right: {distance: {<<: *_dist_not_far}}
      standing: {gamepad: b, timer: 15.0, speech: [stop, down]}

  auto_look_right: {<<: *auto_standing, head: check_right, dst: auto_check_right}
  auto_check_right:
    <<: *auto_standing
    head: look_vright
    out:
      auto_stand2turn_right_90: {distance: {<<: *_dist_far}}
      auto_stand2turn_right_180: {distance: {<<: *_dist_not_far}}
      standing: {gamepad: b, timer: 15.0, speech: [stop, down]}

  auto_stand2turn_left_90: {<<: *auto_standing, legs: stand2turn, dst: auto_turn_left_90}
  auto_turn_left_90:
    <<: *auto_standing
    legs: {state: turn, loop: 1, speed: 0.65}
    out:
      auto_turn2stand:
        sensors: {timer: 15.0}
        exit_frame: {legs: 0}
      turn2stand:
        sensors: {gamepad: b}
        exit_frame: {legs: 0}

  auto_stand2turn_right_90: {<<: *auto_standing, legs: stand2turn, dst: auto_turn_right_90}
  auto_turn_right_90:
    <<: *auto_standing
    legs: {state: turn, reverse: 1, loop: 1, speed: 0.65}
    out:
      auto_turn2stand:
        sensors: {timer: 15.0}
        exit_frame: {legs: 0}
      turn2stand:
        sensors: {gamepad: b}
        exit_frame: {legs: 0}

  auto_stand2turn_right_180: {<<: *auto_standing, legs: stand2turn, dst: auto_turn_right_180}
  auto_turn_right_180:
    <<: *auto_standing
    legs: {state: turn, reverse: 1, loop: 1, speed: 0.65}
    out:
      auto_turn2stand:
        sensors: {timer: 40.0}
        exit_frame: {legs: 0}
      turn2stand:
        sensors: {gamepad: b}
        exit_frame: {legs: 0}

  auto_turn2stand: {<<: *auto_standing, legs: {state: stand2turn, reverse: 1}, dst: auto_standing}


  ## =========================== "DEMO" STATES ===========================
  ## special states used for demo purposes

  ## sitting - touch -> act cute -----------------------------------------

  __lying_cute_cmds: &__lying_cute_cmds  # this is not an actual state; it's only a convenience bundle of settings
    lying2sleep: {gamepad: b, speech: [sleep, down]}
    lying: {timer: 5.0}
    lying2sit: {gamepad: start, speech: up}

  __sitting_cute_cmds: &__sitting_cute_cmds  # this is not an actual state; it's only a convenience bundle of settings
    sit2lying: {gamepad: b, speech: down}
    sitting: {timer: 5.0}
    sit2stand: {gamepad: start, speech: up}

  __standing_cute_cmds: &__standing_cute_cmds  # this is not an actual state; it's only a convenience bundle of settings
    stand2sit: {gamepad: b, speech: down}
    standing: {timer: 5.0}
    stand2walk: {gamepad: start, speech: walk}

  sitting_touch: &sitting_touch
    <<: *sitting
    eyes: fluffy
    out:
      sitting_cute1: {touch: down}
      <<: *__sitting_cute_cmds
  standing_touch: &standing_touch  # same as above, but standing
    <<: *sitting_touch
    legs: standing
    out:
      standing_cute1: {touch: down}
      <<: *__standing_cute_cmds
  lying_touch: &lying_touch  # same as above, but lying
    <<: *sitting_touch
    legs: lying
    out:
      lying_cute1: {touch: down}
      <<: *__lying_cute_cmds
      
  sitting_cute1: &sitting_cute1 # wiggle ears
    <<: *sitting
    head: slight_ur
    ears: {state: wiggle_loop, loop: 1}
    out:
      sitting_cute2: {touch: notouch}
      <<: *__sitting_cute_cmds
  standing_cute1: &standing_cute1  # same as above, but standing
    <<: *sitting_cute1
    legs: standing
    out:
      standing_cute2: {touch: notouch}
      <<: *__standing_cute_cmds
  lying_cute1: &lying_cute1  # same as above, but lying
    <<: *sitting_cute1
    legs: lying
    out:
      lying_cute2: {touch: notouch}
      <<: *__lying_cute_cmds
      
  sitting_cute2: &sitting_cute2
    <<: *sitting
    eyes: fluffy
    out:
      sitting_cute3: {touch: down}
      <<: *__sitting_cute_cmds
  standing_cute2: &standing_cute2
    <<: *sitting_cute2
    legs: standing
    out:
      standing_cute3: {touch: down}
      <<: *__standing_cute_cmds
  lying_cute2: &lying_cute2
    <<: *sitting_cute2
    legs: lying
    out:
      lying_cute3: {touch: down}
      <<: *__lying_cute_cmds

  sitting_cute3: &sitting_cute3 # wiggle ears and shake tail
    <<: *sitting
    head: slight_dl
    ears: {state: wiggle_loop, loop: 1}
    tail: {state: wag_loop, loop: 1}
    out:
      sitting_cute4: {touch: notouch}
      <<: *__sitting_cute_cmds
  standing_cute3: &standing_cute3 # wiggle ears and shake tail
    <<: *sitting_cute3
    legs: standing
    out:
      standing_cute4: {touch: notouch}
      <<: *__standing_cute_cmds
  lying_cute3: &lying_cute3 # wiggle ears and shake tail
    <<: *sitting_cute3
    legs: lying
    out:
      lying_cute4: {touch: notouch}
      <<: *__lying_cute_cmds

  sitting_cute4: &sitting_cute4
    <<: *sitting
    eyes: fluffy
    out:
      sitting_cute5: {touch: down}
      <<: *__sitting_cute_cmds
  standing_cute4: &standing_cute4
    <<: *sitting_cute4
    legs: standing
    out:
      standing_cute5: {touch: down}
      <<: *__standing_cute_cmds
  lying_cute4: &lying_cute4
    <<: *sitting_cute4
    legs: lying
    out:
      lying_cute5: {touch: down}
      <<: *__lying_cute_cmds

  sitting_cute5: &sitting_cute5 # shake tail and love hearts
    <<: *sitting
    head: slight_ur
    ears: wiggle_once
    tail: {state: wag_loop, loop: 1}
    eyes: love
    out:
      sitting_touch: {touch: notouch}
      <<: *__sitting_cute_cmds
  standing_cute5: &standing_cute5 # shake tail and love hearts
    <<: *sitting_cute5
    legs: standing
    out:
      standing_touch: {touch: notouch}
      <<: *__standing_cute_cmds
  lying_cute5: &lying_cute5 # shake tail and love hearts
    <<: *sitting_cute5
    legs: lying
    out:
      lying_touch: {touch: notouch}
      <<: *__lying_cute_cmds


