        - [210, [$W05:0, $W05:1, $W05:2, $W05:3, $W05:4, $W05:5, $W05:6, $W05:7, $WB04:0, $WB04:1, $WB04:2, $WB04:3, $WB04:4, $WB04:5, $WB04:6, $WB04:7]]
        - [625, [$W06:0, $W06:1, $W06:2, $W06:3, $W06:4, $W06:5, $W06:6, $W06:7, $WB05:0, $WB05:1, $WB05:2, $WB05:3, $WB05:4, $WB05:5, $WB05:6, $WB05:7]]
        - [300, [   -93,    -30,     41,   -143, $W07:4, $W07:5, $W07:6, $W07:7, $WB06:0, $WB06:1, $WB06:2, $WB06:3, $WB06:4, $WB06:5, $WB06:6, $WB06:7]]
        - [240, [   -93,    -30,     41,   -143, $W08:4, $W08:5, $W08:6, $W08:7, $WB07:0, $WB07:1, $WB07:2, $WB07:3, $WB07:4, $WB07:5, $WB07:6, $WB07:7]]
        - [195, [$W09:0, $W09:1, $W09:2, $W09:3, $W09:4, $W09:5, $W09:6, $W09:7, $WB08:0, $WB08:1, $WB08:2, $WB08:3, $WB08:4, $WB08:5, $WB08:6, $WB08:7]]
        - [210, [$W10:0, $W10:1, $W10:2, $W10:3, $W10:4, $W10:5, $W10:6, $W10:7, $WB09:0, $WB09:1, $WB09:2, $WB09:3, $WB09:4, $WB09:5, $WB09:6, $WB09:7]]
        - [360, [$W11:0, $W11:1, $W11:2, $W11:3, $W11:4, $W11:5, $W11:6, $W11:7, $WB10:0, $WB10:1, $WB10:2, $WB10:3, $WB10:4, $WB10:5, $WB10:6, $WB10:7]]
      # <tr> these three animations are head + body, maybe the frame times can instanced somehow?
