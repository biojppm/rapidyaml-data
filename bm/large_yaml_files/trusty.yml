  # low level states for the ears -----------------------------------
  ears:
    servos: [ER, EL]
    poses:
      hear_left: [150, -400]
      hear_center: [-400, -400]
      hear_right: [-400, 150]
      up: [-400, -400]
      down: [150, 150]
      front: [400, 400]
      back: [-150, -150]
    anims:
      raise:
        - [350, down]
        - [350, up]
      wiggle_once:
        - [350, down]
        - [250, [400, 0]]
        - [250, [0, 400]]
        - [250, [400, 0]]
        - [250, [0, 400]]
        - [200, down]
      wiggle_loop:
        - [350, [400, 0]]
        - [350, [0, 400]]


  # low level states for the tail -----------------------------------
  tail:
    servos: [T]
    poses:
      down: [ 512]
    anims:
      #tail_up
      wag_once:
        # <tr> can we use simple expressions to calculate the frame data?
        - [200, [-102], up]
        - [200, [-302], wag_left]  # up - 200
        - [200, [  98], wag_right] # up + 200
        - [200, wag_left]
        - [200, up]
      wag_loop: # for shaking tail in a loop
        - [200, wag_left]
        - [200, wag_right]


  # low level states for the eyes -----------------------------------
  eyes:
    active: 1
    states:
      slit:   {tex: slit} # this state merely displays the slit sprite
      cool:   {tex: cool}
      normal: {tex: normal}
      fluffy: {tex: fluffy}
      love:   {tex: love}
      wow:    {tex: wow}
      low_battery:  {tex: batterylow}
      toggle_all_off: {tex: toggle_all_off}
      toggle_all_on:  {tex: toggle_all_on}
      toggle_distance_off: {tex: toggle_distance_off}
      toggle_distance_on:  {tex: toggle_distance_on}
      toggle_speech_off: {tex: toggle_speech_off}
      toggle_speech_on:  {tex: toggle_speech_on}
      toggle_timer_off: {tex: toggle_timer_off}
      toggle_timer_on:  {tex: toggle_timer_on}
      blink_twice_slit_fluffy: {blink: xhi_xhi, nplays: 2, tex0: slit, tex1: fluffy}
      blink_wow_normal_xhi:  {blink: xhi_xhi, loop: 1, tex0: wow   , tex1: normal}
      blink_wow_normal_hi:   {blink: hi_hi  , loop: 1, tex0: wow   , tex1: normal}
      blink_wow_normal_lo:   {blink: lo_lo  , loop: 1, tex0: wow   , tex1: normal}
      blink_wow_normal_xlo:  {blink: xlo_xlo, loop: 1, tex0: wow   , tex1: normal}
      blink_fluffy_slit_xhi: {blink: xhi_xhi, loop: 1, tex0: fluffy, tex1: slit}
      blink_fluffy_slit_lo:  {blink: lo_lo  , loop: 1, tex0: fluffy, tex1: slit}
      blink_fluffy_slit_hi:  {blink: hi_hi  , loop: 1, tex0: fluffy, tex1: slit}
      blink_fluffy_slit_xlo: {blink: xlo_xlo, loop: 1, tex0: fluffy, tex1: slit}
      blink_heartbeat: {blink: heartbeat, loop: 1, tex0: love, tex1: normal}
    sprites: [
      slit, cool, normal, fluffy, love, wow, batterylow,
      toggle_all_off, toggle_all_on,
      toggle_distance_off, toggle_distance_on,
      toggle_speech_off, toggle_speech_on,
      toggle_timer_off, toggle_timer_on]
    blinks: # time sequences alternating between two different sprites
      # timed in milliseconds
      xhi_xhi: [1000, 1000]  # x-high duration
      hi_hi:   [ 500,  500]  # high   duration
      lo_lo:   [ 250,  250]  # low    duration
      xlo_xlo: [ 100,  100]  # x-low  duration
      heartbeat: [300, 500]
    notifications:
      seeing_someone0: {tex: love}
      seeing_someone1: {blink: hi_hi, loop: 1, tex0: wow, tex1: normal}
      hearing_sides: {tex: cool}
      hearing_center: {tex: fluffy}
      # no "tex1" element in blink notifications defaults
      # to using the previous eye state
      heard_it: {blink: lo_lo, nplays: 2, tex0: slit, }
      low_battery: {top_pri: 1, blink: hi_hi, loop: 1, tex0: batterylow, tex1: slit}
      notif_toggle_all_off:      {blink: hi_hi, nplays: 5, tex0: toggle_all_off, tex1: slit}
      notif_toggle_all_on:       {blink: hi_hi, nplays: 5, tex0: toggle_all_on , tex1: slit}
      notif_toggle_distance_off: {blink: hi_hi, nplays: 5, tex0: toggle_distance_off, tex1: slit}
      notif_toggle_distance_on:  {blink: hi_hi, nplays: 5, tex0: toggle_distance_on , tex1: slit}
      notif_toggle_speech_off:   {blink: hi_hi, nplays: 5, tex0: toggle_speech_off, tex1: slit}
      notif_toggle_speech_on:    {blink: hi_hi, nplays: 5, tex0: toggle_speech_on , tex1: slit}
      notif_toggle_timer_off:    {blink: hi_hi, nplays: 5, tex0: toggle_timer_off, tex1: slit}
      notif_toggle_timer_on:     {blink: hi_hi, nplays: 5, tex0: toggle_timer_on , tex1: slit}


  # low level states for power consumption ---------------------------
  power:
    awake: {}
    low_power: {}
    sleep: {}
