#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
behaviors:
  cute:
    enabled: 0
  idle:
    enabled: 0
  listen:
    enabled: 0
    threshold: 0.5
    min_state_duration: 4.0
  lookat:
    enabled: 1
    down-up: {servo: H1, range: [0, 400]}
    left-right: {servo: H2, range: [200, -200]}
    log_target: 0
  power:
    enabled: 0
    disable_delay: 3.0  # number of seconds
    # power at which a low battery indicator is displayed
    battery_low_threshold: 0 # FIXME FIXME FIXME
  # settings to arbitrate competing behavior states (bstates)
  arbitrator:
    # every bstate will have control for at least this duration
    # even if it explicitly yields:
    min_control_duration: 5.0
    priority: [cute, lookat, listen, idle] # behaviors not provided here will have a lower priority


#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
servos:
  log:
    targets: 0
    packs: 0
    power: 0
    ctrl: 0 # enable/disable servo state logging from the opencm controller
  baudrate: 1000000
  speed_factor: 0.85
  speed_ratio_mx_ax: 0.38  # 0.45 = good for faster motions | 0.33 = good for slower motions
  port_1: {id: 3, id_sandbox: 1, protocol: 1.0, desc: AX-12 and MX-28 servos}
  port_2: {id: 1, id_sandbox: 3, protocol: 2.0, desc: XL-320 servos}
  groups:
    all: [head, ears, legs, tail]
    head: [H1, H2]
    ears: [ER, EL]
    tail: [T]
    legs: [front_legs, back_legs]
    front_legs:  [front_right, front_left]
    back_legs:   [back_right, back_left]
    front_right: [FRA, FRB, FRC, FRD]
    front_left:  [FLA, FLB, FLC, FLD]
    back_right:  [BRA, BRB, BRC, BRD]
    back_left:   [BLA, BLB, BLC, BLD]
    front_feet:  [FRD, FLD]
    back_feet:   [BRD, BLD]
  data:
    # type:
    #   0 means MX-28 servos
    #   1 means AX-12 servos
    #   2 means XL-320 servos
    # HEAD --------------------------
    - {pos:  0, name:  H1, id:  1, type: 0, invert: 0, min:  636, max: 1523, voltage_range: [10.0, 12.6], min_sandbox: 1847, max_sandbox: 2473}
    - {pos:  1, name:  H2, id: 11, type: 1, invert: 0, min:  208, max:  818, voltage_range: [10.0, 12.6], min_sandbox:    0, max_sandbox:  400}
    # LEGS --------------------------
    # front-right leg
    - {pos:  2, name: FRA, id: 22, type: 0, invert: 0, min:  841, max: 3021, voltage_range: [10.0, 12.6]} # hip
    - {pos:  3, name: FRB, id:  8, type: 1, invert: 0, min:  221, max:  291, voltage_range: [10.0, 12.6]} # shoulder
    - {pos:  4, name: FRC, id: 17, type: 1, invert: 0, min:  180, max:  780, voltage_range: [10.0, 12.6]} # knee
    - {pos:  5, name: FRD, id: 18, type: 1, invert: 0, min:   70, max:  442, voltage_range: [10.0, 12.6]} # foot
    # back-right leg
    - {pos:  6, name: BRA, id: 20, type: 0, invert: 0, min: 1003, max: 3333, voltage_range: [10.0, 12.6]} # hip
    - {pos:  7, name: BRB, id: 19, type: 1, invert: 0, min:  158, max:  228, voltage_range: [10.0, 12.6]} # shoulder
    - {pos:  8, name: BRC, id:  9, type: 1, invert: 0, min:  189, max:  789, voltage_range: [10.0, 12.6]} # knee
    - {pos:  9, name: BRD, id:  3, type: 1, invert: 0, min:  135, max:  507, voltage_range: [10.0, 12.6]} # foot
    # front-left leg
    - {pos: 10, name: FLA, id: 10, type: 0, invert: 1, min: 1062, max: 3242, voltage_range: [10.0, 12.6]} # hip
    - {pos: 11, name: FLB, id: 14, type: 1, invert: 1, min:  723, max:  802, voltage_range: [10.0, 12.6]} # shoulder
    - {pos: 12, name: FLC, id: 15, type: 1, invert: 1, min:  175, max:  775, voltage_range: [10.0, 12.6]} # knee
    - {pos: 13, name: FLD, id: 13, type: 1, invert: 0, min:  129, max:  501, voltage_range: [10.0, 12.6]} # foot
    # back-right leg
    - {pos: 14, name: BLA, id: 21, type: 0, invert: 1, min:  730, max: 3060, voltage_range: [10.0, 12.6]} # hip
    - {pos: 15, name: BLB, id: 16, type: 1, invert: 1, min:  727, max:  797, voltage_range: [10.0, 12.6]} # shoulder
    - {pos: 16, name: BLC, id: 12, type: 1, invert: 1, min:  180, max:  780, voltage_range: [10.0, 12.6]} # knee
    - {pos: 17, name: BLD, id:  2, type: 1, invert: 0, min:  190, max:  562, voltage_range: [10.0, 12.6]} # foot
    # EARS --------------------------
    - {pos: 18, name:  ER, id:  6, type: 2, invert: 0, min:    0, max: 1023, voltage_range: [4.0, 6.0]}
    - {pos: 19, name:  EL, id:  7, type: 2, invert: 1, min:    0, max: 1023, voltage_range: [4.0, 6.0]}
    # TAIL --------------------------
    - {pos: 20, name:   T, id:  5, type: 2, invert: 0, min:    0, max: 1023, voltage_range: [4.0, 6.0]}


#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
# low level states: these have data on how to make individual components
# behave. States from different components are orthogonal, ie they can
# occur at the same time.
components:

  # component poses are extracted from their named animation frames; but make
  # sure that the names and servo positions are unique at the component scope

  # low level states for the head -----------------------------------
  head:
    servos: [H1, H2]
    poses:
      look_vright: [300, -300]
      look_right:  [300, -150]
      look_center: [300,    0]
      look_left:   [300,  150]
      look_vleft:  [300,  300]
      slight_ur:   [ 90,  -50]
      slight_dr:   [-90,  -50]
      slight_ul:   [ 90,   50]
      slight_dl:   [-90,   50]
      head_down_ovation: [-430, 0]
    anims:
      check_left:
        - [1000, look_center]
        - [1000, look_vleft]
      check_right:
        - [1000, look_center]
        - [1000, look_vright]
      wake_up:
        # tstep  servos
        - [1000, [-430,  280], sleeping]
        - [1000, [-200,  280]]
        - [1200, [ 200,    0]]
        - [ 500, [ 400,    0]]
        - [ 500, [ 400,  150]]
        - [ 500, [ 400, -150]]
        - [ 250, [ 400,    0], awake]
      sleep:
        - [1000, awake]
        - [1000, [ 200,   0]]
        - [1500, [-200, 280]]
        - [1500, sleeping]
      # <tr> these three animations are head + body, maybe the frame times can instanced somehow?
      lying2sit:
        - [1000, awake]
        - [1000, awake]
        - [1000, [300,  0]]
        - [1000, [300,  0]]
        - [1000, [60,  0], awake_sitting]
      stand2sit:
        - [ 500, awake]
        - [ 700, [-430, 0]] #[ 100, 0]]
        - [ 700, [-430, 0]] #[-200, 0]]
        - [ 800, [-430, 0]] #[-430, 0]]
        - [ 800, [-430, 0]] #[-350, 0]]
        - [ 300, awake_sitting]
      stand2lying:
        - [ 500, awake]
        - [ 700, [-430, 0]] #[ 100, 0]]
        - [ 700, [-430, 0]] #[-200, 0]]
        - [ 800, [-430, 0]] #[-430, 0]]
        - [ 800, [-430, 0]] #[-350, 0]]
        - [ 300, [60,  0], awake_sitting]
        - [1000, awake]
        - [1000, awake]

  # low level states for the legs -----------------------------------
  legs:
    servos: [FRA, FRB, FRC, FRD, BRA, BRB, BRC, BRD, FLA, FLB, FLC, FLD, BLA, BLB, BLC, BLD]
    maps:
      mirror: [FRA, FRB, FRC, FRD, BRA, BRB, BRC, BRD, $FRA, $FRB, $FRC, $FRD, $BRA, $BRB, $BRC, $BRD]
    anims:
      stand2walk:
        #          FRA,   FRB,   FRC,   FRD,   BRA,   BRB,   BRC,   BRD,   FLA,   FLB,   FLC,   FLD,   BLA,   BLB,   BLC,   BLD,
        - [200, [$ST:0, $ST:1, $ST:2, $ST:3, $ST:4, $ST:5, $ST:6, $ST:7, $ST:0, $ST:1, $ST:2, $ST:3, $ST:4, $ST:5, $ST:6, $ST:7]]                  # 0 standing
        - [200, [$ST:0, $ST:1, $ST:2, $ST:3, 390,   -15,   -254,  -184,  -237,  -30,   237,   42,    $ST:4, $ST:5, $ST:6, $ST:7], walk_trans1:T1] # 1 BR & FL up
        - [200, [$ST:0, $ST:1, $ST:2, $ST:3, 392,   -15,   -203,  -169,  -371,  -30,   247,   43,    $ST:4, $ST:5, $ST:6, $ST:7], walk_trans2:T2] # 2 BR & FL up
        - [200, [$ST:0, $ST:1, $ST:2, $ST:3, 87,    -15,   -86,   -153,  53,    -30,   8,     -134,  $ST:4, $ST:5, $ST:6, $ST:7], walk_entry:WE ] # 3 walking frame 0
      stand2walk_mirror:
        #          FRA,   FRB,   FRC,   FRD,   BRA,   BRB,   BRC,   BRD,   FLA,   FLB,   FLC,   FLD,   BLA,   BLB,   BLC,   BLD,
        - [200, [$ST:0, $ST:1, $ST:2, $ST:3, $ST:4, $ST:5, $ST:6, $ST:7, $ST:0, $ST:1, $ST:2, $ST:3, $ST:4, $ST:5, $ST:6, $ST:7]] # 0 standing
        - [200, [$T1:8, $T1:9, $T1:10,$T1:11,$ST:4, $ST:5, $ST:6, $ST:7, $ST:0, $ST:1, $ST:2, $ST:3, $T1:4, $T1:5, $T1:6, $T1:7]] # 1 BL & FR up
        - [200, [$T2:8, $T2:9, $T2:10,$T2:11,$ST:4, $ST:5, $ST:6, $ST:7, $ST:0, $ST:1, $ST:2, $ST:3, $T2:4, $T2:5, $T2:6, $T2:7]] # 2 BL & FR up
        - [200, [$WE:8, $WE:9, $WE:10,$WE:11,$ST:4, $ST:5, $ST:6, $ST:7, $ST:0, $ST:1, $ST:2, $ST:3, $WE:4, $WE:5, $WE:6, $WE:7]] # 3 walking frame 6
      stand2walk_rev:
        #          FRA,   FRB,   FRC,   FRD,   BRA,   BRB,   BRC,   BRD,   FLA,   FLB,   FLC,   FLD,   BLA,   BLB,   BLC,   BLD,
        - [200, [$ST:0, $ST:1, $ST:2, $ST:3, 87,    -15,   -86,   -153,  53,    -30,   8,     -134,  $ST:4, $ST:5, $ST:6, $ST:7]] # 3 walking frame 0
        - [200, [$ST:0, $ST:1, $ST:2, $ST:3, 392,   -15,   -203,  -169,  -371,  -30,   247,   43,    $ST:4, $ST:5, $ST:6, $ST:7]] # 2 BR & FL up
        - [200, [$ST:0, $ST:1, $ST:2, $ST:3, 390,   -15,   -254,  -184,  -237,  -30,   237,   42,    $ST:4, $ST:5, $ST:6, $ST:7]] # 1 BR & FL up
        - [200, [$ST:0, $ST:1, $ST:2, $ST:3, $ST:4, $ST:5, $ST:6, $ST:7, $ST:0, $ST:1, $ST:2, $ST:3, $ST:4, $ST:5, $ST:6, $ST:7]]                  # 0 standing
      stand2walk_rev_mirror:
        #          FRA,   FRB,   FRC,   FRD,   BRA,   BRB,   BRC,   BRD,   FLA,   FLB,   FLC,   FLD,   BLA,   BLB,   BLC,   BLD,
        - [200, [$WE:8, $WE:9, $WE:10,$WE:11,$ST:4, $ST:5, $ST:6, $ST:7, $ST:0, $ST:1, $ST:2, $ST:3, $WE:4, $WE:5, $WE:6, $WE:7]] # 3 walking frame 6
