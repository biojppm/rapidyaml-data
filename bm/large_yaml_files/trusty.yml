_fps: &_fps
  target_fps: 60
  sleep_fps: 1
  fps_report: 5.0

_device_on_main_thread: &_on_main_thread
  active: 1

_device_on_separate_thread: &_on_separate_thread
  active: 1
  separate_thread: 1
  <<: *_fps


#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------

# settings for the android app to remotely control trusty
app_ctrl:
  <<: *_on_separate_thread
  server: {ip: 127.0.0.1, port: 10001, maxconn: 1, msg_size_max: 1024}
  heartbeat: {on: 1, timeout: 5.0}


#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------

<<: *_fps  # inherit all the properties from _fps (eg, target_fps, sleep_fps, fps_report)
first_state: sleeping

#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
gamepad:
  <<: *_on_main_thread
  id: E4:17:D8:52:0D:79
  device: /dev/input/event0
  connect_period: 1.0
  log:
    connection: 1
    events: 1
  # available btns:
  #    left, right, up, down
  #    x, y, a, b,
  #    l1, r1
  #    start, select
  # Combos can be also be specified. Eg,
  #    start+up
  #    l1+r1
  #    r1+right+x
  # When combos are specified, then all combo buttons except the last
  # button are muted. Eg, if there is a combo named start+up, then no
  # events from start presses/releases will be triggered.


#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
# opencm servo controller chip
ctrl:
  <<: *_on_separate_thread
  port: /dev/ttyS0  # /dev/ttyAMA0
  baudrate: 1000000
  timeout: 1
  check_battery: 1 # whether to check battery percentage
  low_battery_threshold: 25.0  # percentage
  servo_state_period: 10.0 # seconds
  min_battery_period: 10.0 # seconds


#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
hvc:
  <<: *_on_separate_thread
  port: /dev/ttyACM0
  baudrate: 9600    # available: 9600, 38400, 115200, 230400, 460800, 921600
  use_stb: 0        # whether to use image stabilization (must be false for now)
  targets: [body, face, hand] # all, none, body, hand, face, direction, age,
                              # gender, gaze, blink, expression, recognition
  result_dims: [1600, 1200]   # size of the results image space (coords are 0-based)
  img_type: qvga # image format for capture dumps: none, qqvga=160x120, qvga=320x240


#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
touch:
  <<: *_on_main_thread
  pin: 22


#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
distance: # values in cm
  <<: *_on_separate_thread
  mode: better_accuracy   # good_accuracy, better_accuracy, best_accuracy, long_range, high_speed
  #correction: -2          # this is added to reported distances. comment out to disable
  #cutoff: [2, 90]          # distances outside this range are disregarded. comment out to disable
  dist_close: &_dist_close {lt: 45}
  dist_far: &_dist_far {gt: 55}
  dist_not_far: &_dist_not_far {lt: 55}


#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
sound_balance:
  <<: *_on_separate_thread
  active: 0  # inactive for now
  target_fps: 20.0
  num_samples: 20
  l: {pin: 1, gain: 1, data_rate: 3300} # 250}  #  data_rate: [128, 250, 490, 920, 1600, 2400, 3300]
  r: {pin: 3, gain: 1, data_rate: 3300} # 250}
  maxval: 0.2     # sound levels above this will be clamped to 1
  threshold: 0.1  # threshold for l-r balance
  clap_threshold: 0.6  # threshold for (not-clamped) soundlevel to be considered hand-clapping


#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------

microphone:
  device: 2  # the pyaudio-index of the microphone device
  save_packs: 0 # whether recorded packs should be saved to disk
  type: pysr # choose microphone type. must be one of [pysr, pyaudio]
  pysr: # python speech recognition microphone
    <<: *_on_separate_thread
    phrase_start_timeout: 4.0  # float, max seconds that listen will wait for a phrase to start
    phrase_time_limit: 2.0     # float, max seconds that a phrase can last
  pyaudio:   # raw pyaudio calls. records chunks of fixed duration.
    <<: *_on_separate_thread
    channels: 1
    rate: 16000
    max_duration: 4.0  # max duration of a recorded chunk
  # microphone mode. must be one of:
  #   "eager": record as much as possible
  #   "startstop": record only when a gamepad button is pressed ddown
  #   "clap": record for a preset time after a clapping is heard
  #   "dynamic": eager for some time after a clap is heard or command is uttered. otherwise, clap
  mode: dynamic
  gamepad:  # mic mode: recording only while a btn is pressed down
    toggle_mode: l1+left  # toggle passive/active mode
    rec: l1+right  # record: press to start, release to stop
  dynamic_mode:
    eager_timeout: 30.0
  clap_detection:  # configs for clap mode
    # analyse blocks with this duration in seconds
    block_duration: 0.05
    # noise threshold for a packet to be considered noisy
    initial_threshold: 0.1
    # period recorded after clapping
    listen_timeout: 2.0
    # / block_time: if the noise was longer than this many blocks, it's not a clap
    max_blocks_factor: 0.2
    # / block_time: if we get this many noisy blocks in a row, increase the threshold
    oversensitive_factor: 15.0
    # / block_time: if we get this many quiet blocks in a row, decrease the threshold
    undersensitive_factor: 120.0


