k file\n  entries.\n\nWith `--json`, the output is a JSON object with the following fields:\n\n* `original` and `originalUrl`: The flake reference specified by the\n  user (*flake-url*) in attribute set and URL representation.\n\n* `resolved` and `resolvedUrl`: The resolved flake reference (see\n  above) in attribute set and URL representation.\n\n* `locked` and `lockedUrl`: The locked flake reference (see above) in\n  attribute set and URL representation.\n\n* `description`: See `Description` above.\n\n* `path`: See `Path` above.\n\n* `revision`: See `Revision` above.\n\n* `revCount`: See `Revisions` above.\n\n* `lastModified`: See `Last modified` above.\n\n* `locks`: The contents of `flake.lock`.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"new":{"args":[{"arity":1,"label":"dest-dir","optional":false}],"category":{"description":"Available commands","id":0},"description":"create a flake in the specified directory from a template","doc":"\n\n# Examples\n\n* Create a flake using the default template in the directory `hello`:\n\n  ```console\n  # nix flake new hello\n  ```\n\n* List available templates:\n\n  ```console\n  # nix flake show templates\n  ```\n\n* Create a flake from a specific template in the directory `hello`:\n\n  ```console\n  # nix flake new hello -t templates#trivial\n  ```\n\n# Description\n\nThis command creates a flake in the directory `dest-dir`, which must\nnot already exist. It's equivalent to:\n\n```console\n# mkdir dest-dir\n# cd dest-dir\n# nix flake init\n```\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"template":{"arity":1,"category":"","description":"The template to use.","labels":["template"],"shortName":"t"}}},"prefetch":{"args":[{"arity":1,"label":"flake-url","optional":true}],"category":{"description":"Available commands","id":0},"description":"download the source tree denoted by a flake reference into the Nix store","doc":"\n\n# Examples\n\n* Download a tarball and unpack it:\n\n  ```console\n  # nix flake prefetch https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.10.5.tar.xz\n  Downloaded 'https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.10.5.tar.xz?narHash=sha256-3XYHZANT6AFBV0BqegkAZHbba6oeDkIUCDwbATLMhAY='\n  to '/nix/store/sl5vvk8mb4ma1sjyy03kwpvkz50hd22d-source' (hash\n  'sha256-3XYHZANT6AFBV0BqegkAZHbba6oeDkIUCDwbATLMhAY=').\n  ```\n\n* Download the `dwarffs` flake (looked up in the flake registry):\n\n  ```console\n  # nix flake prefetch dwarffs --json\n  {\"hash\":\"sha256-VHg3MYVgQ12LeRSU2PSoDeKlSPD8PYYEFxxwkVVDRd0=\"\n  ,\"storePath\":\"/nix/store/hang3792qwdmm2n0d9nsrs5n6bsws6kv-source\"}\n  ```\n\n# Description\n\nThis command downloads the source tree denoted by flake reference\n*flake-url*. Note that this does not need to be a flake (i.e. it does\nnot have to contain a `flake.nix` file).\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"show":{"args":[{"arity":1,"label":"flake-url","optional":true}],"category":{"description":"Available commands","id":0},"description":"show the outputs provided by a flake","doc":"\n\n# Examples\n\n* Show the output attributes provided by the `patchelf` flake:\n\n  ```console\n  github:NixOS/patchelf/f34751b88bd07d7f44f5cd3200fb4122bf916c7e\n  ├───checks\n  │   ├───aarch64-linux\n  │   │   └───build: derivation 'patchelf-0.12.20201207.f34751b'\n  │   ├───i686-linux\n  │   │   └───build: derivation 'patchelf-0.12.20201207.f34751b'\n  │   └───x86_64-linux\n  │       └───build: derivation 'patchelf-0.12.20201207.f34751b'\n  ├───packages\n  │   ├───aarch64-linux\n  │   │   └───default: package 'patchelf-0.12.20201207.f34751b'\n  │   ├───i686-linux\n  │   │   └───default: package 'patchelf-0.12.20201207.f34751b'\n  │   └───x86_64-linux\n  │       └───default: package 'patchelf-0.12.20201207.f34751b'\n  ├───hydraJobs\n  │   ├───build\n  │   │   ├───aarch64-linux: derivation 'patchelf-0.12.20201207.f34751b'\n  │   │   ├───i686-linux: derivation 'patchelf-0.12.20201207.f34751b'\n  │   │   └───x86_64-linux: derivation 'patchelf-0.12.20201207.f34751b'\n  │   ├───coverage: derivation 'patchelf-coverage-0.12.20201207.f34751b'\n  │   ├───release: derivation 'patchelf-0.12.20201207.f34751b'\n  │   └───tarball: derivation 'patchelf-tarball-0.12.20201207.f34751b'\n  └───overlay: Nixpkgs overlay\n  ```\n\n# Description\n\nThis command shows the output attributes provided by the flake\nspecified by flake reference *flake-url*. These are the top-level\nattributes in the `outputs` of the flake, as well as lower-level\nattributes for some standard outputs (e.g. `packages` or `checks`).\n\nWith `--json`, the output is in a JSON representation suitable for automatic\nprocessing by other tools.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"legacy":{"arity":0,"category":"","description":"Show the contents of the `legacyPackages` output."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"update":{"args":[{"arity":1,"label":"flake-url","optional":true}],"category":{"description":"Available commands","id":0},"description":"update flake lock file","doc":"\n\n# Examples\n\n* Recreate the lock file (i.e. update all inputs) and commit the new\n  lock file:\n\n  ```console\n  # nix flake update --commit-lock-file\n  * Updated 'nix': 'github:NixOS/nix/9fab14adbc3810d5cc1f88672fde1eee4358405c' -> 'github:NixOS/nix/8927cba62f5afb33b01016d5c4f7f8b7d0adde3c'\n  * Updated 'nixpkgs': 'github:NixOS/nixpkgs/3d2d8f281a27d466fa54b469b5993f7dde198375' -> 'github:NixOS/nixpkgs/a3a3dda3bacf61e8a39258a0ed9c924eeca8e293'\n  …\n  warning: committed new revision '158bcbd9d6cc08ab859c0810186c1beebc982aad'\n  ```\n\n# Description\n\nThis command recreates the lock file of a flake (`flake.lock`), thus\nupdating the lock for every mutable input (like `nixpkgs`) to its\ncurrent version. This is equivalent to passing `--recreate-lock-file`\nto any command that operates on a flake. That is,\n\n```console\n# nix flake update\n# nix build\n```\n\nis equivalent to:\n\n```console\n# nix build --recreate-lock-file\n```\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]}}}},"description":"manage Nix flakes","doc":"\n\n# Description\n\n`nix flake` provides subcommands for creating, modifying and querying\n*Nix flakes*. Flakes are the unit for packaging Nix code in a\nreproducible and discoverable way. They can have dependencies on other\nflakes, making it possible to have multi-repository Nix projects.\n\nA flake is a filesystem tree (typically fetched from a Git repository\nor a tarball) that contains a file named `flake.nix` in the root\ndirectory. `flake.nix` specifies some metadata about the flake such as\ndependencies (called *inputs*), as well as its *outputs* (the Nix\nvalues such as packages or NixOS modules provided by the flake).\n\n# Flake references\n\nFlake references (*flakerefs*) are a way to specify the location of a\nflake. These have two different forms:\n\n* An attribute set representation, e.g.\n\n  ```nix\n  {\n    type = \"github\";\n    owner = \"NixOS\";\n    repo = \"nixpkgs\";\n  }\n  ```\n\n  The only required attribute is `type`. The supported types are\n  listed below.\n\n* A URL-like syntax, e.g.\n\n  ```\n  github:NixOS/nixpkgs\n  ```\n\n  These are used on the command line as a more convenient alternative\n  to the attribute set representation. For instance, in the command\n\n  ```console\n  # nix build github:NixOS/nixpkgs#hello\n  ```\n\n  `github:NixOS/nixpkgs` is a flake reference (while `hello` is an\n  output attribute). They are also allowed in the `inputs` attribute\n  of a flake, e.g.\n\n  ```nix\n  inputs.nixpkgs.url = github:NixOS/nixpkgs;\n  ```\n\n  is equivalent to\n\n  ```nix\n  inputs.nixpkgs = {\n    type = \"github\";\n    owner = \"NixOS\";\n    repo = \"nixpkgs\";\n  };\n  ```\n\n## Examples\n\nHere are some examples of flake references in their URL-like representation:\n\n* `.`: The flake in the current directory.\n* `/home/alice/src/patchelf`: A flake in some other directory.\n* `nixpkgs`: The `nixpkgs` entry in the flake registry.\n* `nixpkgs/a3a3dda3bacf61e8a39258a0ed9c924eeca8e293`: The `nixpkgs`\n  entry in the flake registry, with its Git revision overridden to a\n  specific value.\n* `github:NixOS/nixpkgs`: The `master` branch of the `NixOS/nixpkgs`\n  repository on GitHub.\n* `github:NixOS/nixpkgs/nixos-20.09`: The `nixos-20.09` branch of the\n  `nixpkgs` repository.\n* `github:NixOS/nixpkgs/a3a3dda3bacf61e8a39258a0ed9c924eeca8e293`: A\n  specific revision of the `nixpkgs` repository.\n* `github:edolstra/nix-warez?dir=blender`: A flake in a subdirectory\n  of a GitHub repository.\n* `git+https://github.com/NixOS/patchelf`: A Git repository.\n* `git+https://github.com/NixOS/patchelf?ref=master`: A specific\n  branch of a Git repository.\n* `git+https://github.com/NixOS/patchelf?ref=master&rev=f34751b88bd07d7f44f5cd3200fb4122bf916c7e`:\n  A specific branch *and* revision of a Git repository.\n* `https://github.com/NixOS/patchelf/archive/master.tar.gz`: A tarball\n  flake.\n\n## Flake reference attributes\n\nThe following generic flake reference attributes are supported:\n\n* `dir`: The subdirectory of the flake in which `flake.nix` is\n  located. This parameter enables having multiple flakes in a\n  repository or tarball. The default is the root directory of the\n  flake.\n\n* `narHash`: The hash of the NAR serialisation (in SRI format) of the\n  contents of the flake. This is useful for flake types such as\n  tarballs that lack a unique content identifier such as a Git commit\n  hash.\n\nIn addition, the following attributes are common to several flake\nreference types:\n\n* `rev`: A Git or Mercurial commit hash.\n\n* `ref`: A Git or Mercurial branch or tag name.\n\nFinally, some attribute are typically not specified by the user, but\ncan occur in *locked* flake references and are available to Nix code:\n\n* `revCount`: The number of ancestors of the commit `rev`.\n\n* `lastModified`: The timestamp (in seconds since the Unix epoch) of\n  the last modification of this version of the flake. For\n  Git/Mercurial flakes, this is the commit time of commit *rev*, while\n  for tarball flakes, it's the most recent timestamp of any file\n  inside the tarball.\n\n## Types\n\nCurrently the `type` attribute can be one of the following:\n\n* `path`: arbitrary local directories, or local Git trees. The\n  required attribute `path` specifies the path of the flake. The URL\n  form is\n\n  ```\n  [path:]<path>(\\?<params)?\n  ```\n\n  where *path* is an absolute path.\n\n  *path* must be a directory in the file system containing a file\n  named `flake.nix`.\n\n  *path* generally must be an absolute path. However, on the command\n  line, it can be a relative path (e.g. `.` or `./foo`) which is\n  interpreted as relative to the current directory. In this case, it\n  must start with `.` to avoid ambiguity with registry lookups\n  (e.g. `nixpkgs` is a registry lookup; `./nixpkgs` is a relative\n  path).\n\n* `git`: Git repositories. The location of the repository is specified\n  by the attribute `url`.\n\n  They have the URL form\n\n  ```\n  git(+http|+https|+ssh|+git|+file|):(//<server>)?<path>(\\?<params>)?\n  ```\n\n  The `ref` attribute defaults to resolving the `HEAD` reference.\n\n  The `rev` attribute must denote a commit that exists in the branch\n  or tag specified by the `ref` attribute, since Nix doesn't do a full\n  clone of the remote repository by default (and the Git protocol\n  doesn't allow fetching a `rev` without a known `ref`). The default\n  is the commit currently pointed to by `ref`.\n\n  When `git+file` is used without specifying `ref` or `rev`, files are\n  fetched directly from the local `path` as long as they have been added\n  to the Git repository. If there are uncommitted changes, the reference\n  is treated as dirty and a warning is printed.\n\n  For example, the following are valid Git flake references:\n\n  * `git+https://example.org/my/repo`\n  * `git+https://example.org/my/repo?dir=flake1`\n  * `git+ssh://git@github.com/NixOS/nix?ref=v1.2.3`\n  * `git://github.com/edolstra/dwarffs?ref=unstable&rev=e486d8d40e626a20e06d792db8cc5ac5aba9a5b4`\n  * `git+file:///home/my-user/some-repo/some-repo`\n\n* `mercurial`: Mercurial repositories. The URL form is similar to the\n  `git` type, except that the URL schema must be one of `hg+http`,\n  `hg+https`, `hg+ssh` or `hg+file`.\n\n* `tarball`: Tarballs. The location of the tarball is specified by the\n  attribute `url`.\n\n  In URL form, the schema must be `tarball+http://`, `tarball+https://` or `tarball+file://`.\n  If the extension corresponds to a known archive format (`.zip`, `.tar`,\n  `.tgz`, `.tar.gz`, `.tar.xz`, `.tar.bz2` or `.tar.zst`), then the `tarball+`\n  can be dropped.\n\n* `file`: Plain files or directory tarballs, either over http(s) or from the local\n  disk.\n\n  In URL form, the schema must be `file+http://`, `file+https://` or `file+file://`.\n  If the extension doesn’t correspond to a known archive format (as defined by the\n  `tarball` fetcher), then the `file+` prefix can be dropped.\n\n* `github`: A more efficient way to fetch repositories from\n  GitHub. The following attributes are required:\n\n  * `owner`: The owner of the repository.\n\n  * `repo`: The name of the repository.\n\n  These are downloaded as tarball archives, rather than\n  through Git. This is often much faster and uses less disk space\n  since it doesn't require fetching the entire history of the\n  repository. On the other hand, it doesn't allow incremental fetching\n  (but full downloads are often faster than incremental fetches!).\n\n  The URL syntax for `github` flakes is:\n\n  ```\n  github:<owner>/<repo>(/<rev-or-ref>)?(\\?<params>)?\n  ```\n\n  `<rev-or-ref>` specifies the name of a branch or tag (`ref`), or a\n  commit hash (`rev`). Note that unlike Git, GitHub allows fetching by\n  commit hash without specifying a branch or tag.\n\n  Some examples:\n\n  * `github:edolstra/dwarffs`\n  * `github:edolstra/dwarffs/unstable`\n  * `github:edolstra/dwarffs/d3f2baba8f425779026c6ec04021b2e927f61e31`\n\n* `sourcehut`: Similar to `github`, is a more efficient way to fetch\n  SourceHut repositories. The following attributes are required:\n\n  * `owner`: The owner of the repository (including leading `~`).\n\n  * `repo`: The name of the repository.\n\n  Like `github`, these are downloaded as tarball archives.\n\n  The URL syntax for `sourcehut` flakes is:\n\n  `sourcehut:<owner>/<repo>(/<rev-or-ref>)?(\\?<params>)?`\n\n  `<rev-or-ref>` works the same as `github`. Either a branch or tag name\n  (`ref`), or a commit hash (`rev`) can be specified.\n\n  Since SourceHut allows for self-hosting, you can specify `host` as\n  a parameter, to point to any instances other than `git.sr.ht`.\n\n  Currently, `ref` name resolution only works for Git repositories.\n  You can refer to Mercurial repositories by simply changing `host` to\n  `hg.sr.ht` (or any other Mercurial instance). With the caveat\n  that you must explicitly specify a commit hash (`rev`).\n\n  Some examples:\n\n  * `sourcehut:~misterio/nix-colors`\n  * `sourcehut:~misterio/nix-colors/main`\n  * `sourcehut:~misterio/nix-colors?host=git.example.org`\n  * `sourcehut:~misterio/nix-colors/182b4b8709b8ffe4e9774a4c5d6877bf6bb9a21c`\n  * `sourcehut:~misterio/nix-colors/21c1a380a6915d890d408e9f22203436a35bb2de?host=hg.sr.ht`\n\n* `indirect`: Indirections through the flake registry. These have the\n  form\n\n  ```\n  [flake:]<flake-id>(/<rev-or-ref>(/rev)?)?\n  ```\n\n  These perform a lookup of `<flake-id>` in the flake registry. For\n  example, `nixpkgs` and `nixpkgs/release-20.09` are indirect flake\n  references. The specified `rev` and/or `ref` are merged with the\n  entry in the registry; see [nix registry](./nix3-registry.md) for\n  details.\n\n# Flake format\n\nAs an example, here is a simple `flake.nix` that depends on the\nNixpkgs flake and provides a single package (i.e. an installable\nderivation):\n\n```nix\n{\n  description = \"A flake for building Hello World\";\n\n  inputs.nixpkgs.url = github:NixOS/nixpkgs/nixos-20.03;\n\n  outputs = { self, nixpkgs }: {\n\n    packages.x86_64-linux.default =\n      # Notice the reference to nixpkgs here.\n      with import nixpkgs { system = \"x86_64-linux\"; };\n      stdenv.mkDerivation {\n        name = \"hello\";\n        src = self;\n        buildPhase = \"gcc -o hello ./hello.c\";\n        installPhase = \"mkdir -p $out/bin; install -t $out/bin hello\";\n      };\n\n  };\n}\n```\n\nThe following attributes are supported in `flake.nix`:\n\n* `description`: A short, one-line description of the flake.\n\n* `inputs`: An attrset specifying the dependencies of the flake\n  (described below).\n\n* `outputs`: A function that, given an attribute set containing the\n  outputs of each of the input flakes keyed by their identifier,\n  yields the Nix values provided by this flake. Thus, in the example\n  above, `inputs.nixpkgs` contains the result of the call to the\n  `outputs` function of the `nixpkgs` flake.\n\n  In addition to the outputs of each input, each input in `inputs`\n  also contains some metadata about the inputs. These are:\n\n  * `outPath`: The path in the Nix store of the flake's source tree.\n\n  * `rev`: The commit hash of the flake's repository, if applicable.\n\n  * `revCount`: The number of ancestors of the revision `rev`. This is\n    not available for `github` repositories, since they're fetched as\n    tarballs rather than as Git repositories.\n\n  * `lastModifiedDate`: The commit time of the revision `rev`, in the\n    format `%Y%m%d%H%M%S` (e.g. `20181231100934`). Unlike `revCount`,\n    this is available for both Git and GitHub repositories, so it's\n    useful for generating (hopefully) monotonically increasing version\n    strings.\n\n  * `lastModified`: The commit time of the revision `rev` as an integer\n    denoting the number of seconds since 1970.\n\n  * `narHash`: The SHA-256 (in SRI format) of the NAR serialization of\n    the flake's source tree.\n\n  The value returned by the `outputs` function must be an attribute\n  set. The attributes can have arbitrary values; however, various\n  `nix` subcommands require specific attributes to have a specific\n  value (e.g. `packages.x86_64-linux` must be an attribute set of\n  derivations built for the `x86_64-linux` platform).\n\n* `nixConfig`: a set of `nix.conf` options to be set when evaluating any\n  part of a flake. In the interests of security, only a small set of\n  whitelisted options (currently `bash-prompt`, `bash-prompt-prefix`,\n  `bash-prompt-suffix`, and `flake-registry`) are allowed to be set without\n  confirmation so long as `accept-flake-config` is not set in the global\n  configuration.\n\n## Flake inputs\n\nThe attribute `inputs` specifies the dependencies of a flake, as an\nattrset mapping input names to flake references. For example, the\nfollowing specifies a dependency on the `nixpkgs` and `import-cargo`\nrepositories:\n\n```nix\n# A GitHub repository.\ninputs.import-cargo = {\n  type = \"github\";\n  owner = \"edolstra\";\n  repo = \"import-cargo\";\n};\n\n# An indirection through the flake registry.\ninputs.nixpkgs = {\n  type = \"indirect\";\n  id = \"nixpkgs\";\n};\n```\n\nAlternatively, you can use the URL-like syntax:\n\n```nix\ninputs.import-cargo.url = github:edolstra/import-cargo;\ninputs.nixpkgs.url = \"nixpkgs\";\n```\n\nEach input is fetched, evaluated and passed to the `outputs` function\nas a set of attributes with the same name as the corresponding\ninput. The special input named `self` refers to the outputs and source\ntree of *this* flake. Thus, a typical `outputs` function looks like\nthis:\n\n```nix\noutputs = { self, nixpkgs, import-cargo }: {\n  ... outputs ...\n};\n```\n\nIt is also possible to omit an input entirely and *only* list it as\nexpected function argument to `outputs`. Thus,\n\n```nix\noutputs = { self, nixpkgs }: ...;\n```\n\nwithout an `inputs.nixpkgs` attribute is equivalent to\n\n```nix\ninputs.nixpkgs = {\n  type = \"indirect\";\n  id = \"nixpkgs\";\n};\n```\n\nRepositories that don't contain a `flake.nix` can also be used as\ninputs, by setting the input's `flake` attribute to `false`:\n\n```nix\ninputs.grcov = {\n  type = \"github\";\n  owner = \"mozilla\";\n  repo = \"grcov\";\n  flake = false;\n};\n\noutputs = { self, nixpkgs, grcov }: {\n  packages.x86_64-linux.grcov = stdenv.mkDerivation {\n    src = grcov;\n    ...\n  };\n};\n```\n\nTransitive inputs can be overridden from a `flake.nix` file. For\nexample, the following overrides the `nixpkgs` input of the `nixops`\ninput:\n\n```nix\ninputs.nixops.inputs.nixpkgs = {\n  type = \"github\";\n  owner = \"my-org\";\n  repo = \"nixpkgs\";\n};\n```\n\nIt is also possible to \"inherit\" an input from another input. This is\nuseful to minimize flake dependencies. For example, the following sets\nthe `nixpkgs` input of the top-level flake to be equal to the\n`nixpkgs` input of the `dwarffs` input of the top-level flake:\n\n```nix\ninputs.nixpkgs.follows = \"dwarffs/nixpkgs\";\n```\n\nThe value of the `follows` attribute is a `/`-separated sequence of\ninput names denoting the path of inputs to be followed from the root\nflake.\n\nOverrides and `follows` can be combined, e.g.\n\n```nix\ninputs.nixops.inputs.nixpkgs.follows = \"dwarffs/nixpkgs\";\n```\n\nsets the `nixpkgs` input of `nixops` to be the same as the `nixpkgs`\ninput of `dwarffs`. It is worth noting, however, that it is generally\nnot useful to eliminate transitive `nixpkgs` flake inputs in this\nway. Most flakes provide their functionality through Nixpkgs overlays\nor NixOS modules, which are composed into the top-level flake's\n`nixpkgs` input; so their own `nixpkgs` input is usually irrelevant.\n\n# Lock files\n\nInputs specified in `flake.nix` are typically \"unlocked\" in the sense\nthat they don't specify an exact revision. To ensure reproducibility,\nNix will automatically generate and use a *lock file* called\n`flake.lock` in the flake's directory. The lock file contains a graph\nstructure isomorphic to the graph of dependencies of the root\nflake. Each node in the graph (except the root node) maps the\n(usually) unlocked input specifications in `flake.nix` to locked input\nspecifications. Each node also contains some metadata, such as the\ndependencies (outgoing edges) of the node.\n\nFor example, if `flake.nix` has the inputs in the example above, then\nthe resulting lock file might be:\n\n```json\n{\n  \"version\": 7,\n  \"root\": \"n1\",\n  \"nodes\": {\n    \"n1\": {\n      \"inputs\": {\n        \"nixpkgs\": \"n2\",\n        \"import-cargo\": \"n3\",\n        \"grcov\": \"n4\"\n      }\n    },\n    \"n2\": {\n      \"inputs\": {},\n      \"locked\": {\n        \"owner\": \"edolstra\",\n        \"repo\": \"nixpkgs\",\n        \"rev\": \"7f8d4b088e2df7fdb6b513bc2d6941f1d422a013\",\n        \"type\": \"github\",\n        \"lastModified\": 1580555482,\n        \"narHash\": \"sha256-OnpEWzNxF/AU4KlqBXM2s5PWvfI5/BS6xQrPvkF5tO8=\"\n      },\n      \"original\": {\n        \"id\": \"nixpkgs\",\n        \"type\": \"indirect\"\n      }\n    },\n    \"n3\": {\n      \"inputs\": {},\n      \"locked\": {\n        \"owner\": \"edolstra\",\n        \"repo\": \"import-cargo\",\n        \"rev\": \"8abf7b3a8cbe1c8a885391f826357a74d382a422\",\n        \"type\": \"github\",\n        \"lastModified\": 1567183309,\n        \"narHash\": \"sha256-wIXWOpX9rRjK5NDsL6WzuuBJl2R0kUCnlpZUrASykSc=\"\n      },\n      \"original\": {\n        \"owner\": \"edolstra\",\n        \"repo\": \"import-cargo\",\n        \"type\": \"github\"\n      }\n    },\n    \"n4\": {\n      \"inputs\": {},\n      \"locked\": {\n        \"owner\": \"mozilla\",\n        \"repo\": \"grcov\",\n        \"rev\": \"989a84bb29e95e392589c4e73c29189fd69a1d4e\",\n        \"type\": \"github\",\n        \"lastModified\": 1580729070,\n        \"narHash\": \"sha256-235uMxYlHxJ5y92EXZWAYEsEb6mm+b069GAd+BOIOxI=\"\n      },\n      \"original\": {\n        \"owner\": \"mozilla\",\n        \"repo\": \"grcov\",\n        \"type\": \"github\"\n      },\n      \"flake\": false\n    }\n  }\n}\n```\n\nThis graph has 4 nodes: the root flake, and its 3 dependencies. The\nnodes have arbitrary labels (e.g. `n1`). The label of the root node of\nthe graph is specified by the `root` attribute. Nodes contain the\nfollowing fields:\n\n* `inputs`: The dependencies of this node, as a mapping from input\n  names (e.g. `nixpkgs`) to node labels (e.g. `n2`).\n\n* `original`: The original input specification from `flake.lock`, as a\n  set of `builtins.fetchTree` arguments.\n\n* `locked`: The locked input specification, as a set of\n  `builtins.fetchTree` arguments. Thus, in the example above, when we\n  build this flake, the input `nixpkgs` is mapped to revision\n  `7f8d4b088e2df7fdb6b513bc2d6941f1d422a013` of the `edolstra/nixpkgs`\n  repository on GitHub.\n\n  It also includes the attribute `narHash`, specifying the expected\n  contents of the tree in the Nix store (as computed by `nix\n  hash-path`), and may include input-type-specific attributes such as\n  the `lastModified` or `revCount`. The main reason for these\n  attributes is to allow flake inputs to be substituted from a binary\n  cache: `narHash` allows the store path to be computed, while the\n  other attributes are necessary because they provide information not\n  stored in the store path.\n\n* `flake`: A Boolean denoting whether this is a flake or non-flake\n  dependency. Corresponds to the `flake` attribute in the `inputs`\n  attribute in `flake.nix`.\n\nThe `original` and `locked` attributes are omitted for the root\nnode. This is because we cannot record the commit hash or content hash\nof the root flake, since modifying `flake.lock` will invalidate these.\n\nThe graph representation of lock files allows circular dependencies\nbetween flakes. For example, here are two flakes that reference each\nother:\n\n```nix\n{\n  inputs.b = ... location of flake B ...;\n  # Tell the 'b' flake not to fetch 'a' again, to ensure its 'a' is\n  # *this* 'a'.\n  inputs.b.inputs.a.follows = \"\";\n  outputs = { self, b }: {\n    foo = 123 + b.bar;\n    xyzzy = 1000;\n  };\n}\n```\n\nand\n\n```nix\n{\n  inputs.a = ... location of flake A ...;\n  inputs.a.inputs.b.follows = \"\";\n  outputs = { self, a }: {\n    bar = 456 + a.xyzzy;\n  };\n}\n```\n\nLock files transitively lock direct as well as indirect\ndependencies. That is, if a lock file exists and is up to date, Nix\nwill not look at the lock files of dependencies. However, lock file\ngeneration itself *does* use the lock files of dependencies by\ndefault.\n\n","flags":{}},"fmt":{"args":[{"label":"args","optional":false}],"category":{"description":"Infrequently used commands","id":100},"description":"reformat your code in the standard style","doc":"\n\n# Examples\n\nWith [nixpkgs-fmt](https://github.com/nix-community/nixpkgs-fmt):\n\n```nix\n# flake.nix\n{\n  outputs = { nixpkgs, self }: {\n    formatter.x86_64-linux = nixpkgs.legacyPackages.x86_64-linux.nixpkgs-fmt;\n  };\n}\n```\n\n- Format the current flake: `$ nix fmt`\n\n- Format a specific folder or file: `$ nix fmt ./folder ./file.nix`\n\nWith [nixfmt](https://github.com/serokell/nixfmt):\n\n```nix\n# flake.nix\n{\n  outputs = { nixpkgs, self }: {\n    formatter.x86_64-linux = nixpkgs.legacyPackages.x86_64-linux.nixfmt;\n  };\n}\n```\n\n- Format specific files: `$ nix fmt ./file1.nix ./file2.nix`\n\nWith [Alejandra](https://github.com/kamadorueda/alejandra):\n\n```nix\n# flake.nix\n{\n  outputs = { nixpkgs, self }: {\n    formatter.x86_64-linux = nixpkgs.legacyPackages.x86_64-linux.alejandra;\n  };\n}\n```\n\n- Format the current flake: `$ nix fmt`\n\n- Format a specific folder or file: `$ nix fmt ./folder ./file.nix`\n\n# Description\n\n`nix fmt` will rewrite all Nix files (\\*.nix) to a canonical format\nusing the formatter specified in your flake.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"hash":{"args":[{"arity":1,"label":"subcommand","optional":true}],"category":{"description":"Utility/scripting commands","id":101},"commands":{"file":{"args":[{"label":"paths","optional":false}],"category":{"description":"Available commands","id":0},"description":"print cryptographic hash of a regular file","flags":{"base16":{"arity":0,"category":"","description":"Print the hash in base-16 format."},"base32":{"arity":0,"category":"","description":"Print the hash in base-32 (Nix-specific) format."},"base64":{"arity":0,"category":"","description":"Print the hash in base-64 format."},"sri":{"arity":0,"category":"","description":"Print the hash in SRI format."},"type":{"arity":1,"category":"","description":"hash algorithm ('md5', 'sha1', 'sha256', or 'sha512')","labels":["hash-algo"]}}},"path":{"args":[{"label":"paths","optional":false}],"category":{"description":"Available commands","id":0},"description":"print cryptographic hash of the NAR serialisation of a path","flags":{"base16":{"arity":0,"category":"","description":"Print the hash in base-16 format."},"base32":{"arity":0,"category":"","description":"Print the hash in base-32 (Nix-specific) format."},"base64":{"arity":0,"category":"","description":"Print the hash in base-64 format."},"sri":{"arity":0,"category":"","description":"Print the hash in SRI format."},"type":{"arity":1,"category":"","description":"hash algorithm ('md5', 'sha1', 'sha256', or 'sha512')","labels":["hash-algo"]}}},"to-base16":{"args":[{"label":"strings","optional":false}],"category":{"description":"Available commands","id":0},"description":"convert a hash to base-16 representation","flags":{"type":{"arity":1,"category":"","description":"hash algorithm ('md5', 'sha1', 'sha256', or 'sha512'). Optional as can also be gotten from SRI hash itself.","labels":["hash-algo"]}}},"to-base32":{"args":[{"label":"strings","optional":false}],"category":{"description":"Available commands","id":0},"description":"convert a hash to base-32 representation","flags":{"type":{"arity":1,"category":"","description":"hash algorithm ('md5', 'sha1', 'sha256', or 'sha512'). Optional as can also be gotten from SRI hash itself.","labels":["hash-algo"]}}},"to-base64":{"args":[{"label":"strings","optional":false}],"category":{"description":"Available commands","id":0},"description":"convert a hash to base-64 representation","flags":{"type":{"arity":1,"category":"","description":"hash algorithm ('md5', 'sha1', 'sha256', or 'sha512'). Optional as can also be gotten from SRI hash itself.","labels":["hash-algo"]}}},"to-sri":{"args":[{"label":"strings","optional":false}],"category":{"description":"Available commands","id":0},"description":"convert a hash to SRI representation","flags":{"type":{"arity":1,"category":"","description":"hash algorithm ('md5', 'sha1', 'sha256', or 'sha512'). Optional as can also be gotten from SRI hash itself.","labels":["hash-algo"]}}}},"description":"compute and convert cryptographic hashes","flags":{}},"help":{"args":[{"label":"subcommand","optional":false}],"category":{"description":"Main commands","id":0},"description":"show help about `nix` or a particular subcommand","doc":"\n\n# Examples\n\n* Show help about `nix` in general:\n\n  ```console\n  # nix help\n  ```\n\n* Show help about a particular subcommand:\n\n  ```console\n      # nix help flake info\n  ```\n\n","flags":{}},"key":{"args":[{"arity":1,"label":"subcommand","optional":true}],"category":{"description":"Utility/scripting commands","id":101},"commands":{"convert-secret-to-public":{"args":[],"category":{"description":"Available commands","id":0},"description":"generate a public key for verifying store paths from a secret key read from standard input","doc":"\n\n# Examples\n\n* Convert a secret key to a public key:\n\n  ```console\n  # echo cache.example.org-0:E7lAO+MsPwTFfPXsdPtW8GKui/5ho4KQHVcAGnX+Tti1V4dUxoVoqLyWJ4YESuZJwQ67GVIksDt47og+tPVUZw== \\\n    | nix key convert-secret-to-public\n  cache.example.org-0:tVeHVMaFaKi8lieGBErmScEOuxlSJLA7eO6IPrT1VGc=\n  ```\n\n# Description\n\nThis command reads a Ed25519 secret key from standard input, and\nwrites the corresponding public key to standard output. For more\ndetails, see [nix key generate-secret](./nix3-key-generate-secret.md).\n\n","flags":{}},"generate-secret":{"args":[],"category":{"description":"Available commands","id":0},"description":"generate a secret key for signing store paths","doc":"\n\n# Examples\n\n* Generate a new secret key:\n\n  ```console\n  # nix key generate-secret --key-name cache.example.org-1 > ./secret-key\n  ```\n\n  We can then use this key to sign the closure of the Hello package:\n\n  ```console\n  # nix build nixpkgs#hello\n  # nix store sign --key-file ./secret-key --recursive ./result\n  ```\n\n  Finally, we can verify the store paths using the corresponding\n  public key:\n\n  ```\n  # nix store verify --trusted-public-keys $(nix key convert-secret-to-public < ./secret-key) ./result\n  ```\n\n# Description\n\nThis command generates a new Ed25519 secret key for signing store\npaths and prints it on standard output. Use `nix key\nconvert-secret-to-public` to get the corresponding public key for\nverifying signed store paths.\n\nThe mandatory argument `--key-name` specifies a key name (such as\n`cache.example.org-1`). It is used to look up keys on the client when\nit verifies signatures. It can be anything, but it’s suggested to use\nthe host name of your cache (e.g.  `cache.example.org`) with a suffix\ndenoting the number of the key (to be incremented every time you need\nto revoke a key).\n\n# Format\n\nBoth secret and public keys are represented as the key name followed\nby a base-64 encoding of the Ed25519 key data, e.g.\n\n```\ncache.example.org-0:E7lAO+MsPwTFfPXsdPtW8GKui/5ho4KQHVcAGnX+Tti1V4dUxoVoqLyWJ4YESuZJwQ67GVIksDt47og+tPVUZw==\n```\n\n","flags":{"key-name":{"arity":1,"category":"","description":"Identifier of the key (e.g. `cache.example.org-1`).","labels":["name"]}}}},"description":"generate and convert Nix signing keys","flags":{}},"log":{"args":[{"arity":1,"label":"installable","optional":true}],"category":{"description":"Infrequently used commands","id":100},"description":"show the build log of the specified packages or paths, if available","doc":"\n\n# Examples\n\n* Get the build log of GNU Hello:\n\n  ```console\n  # nix log nixpkgs#hello\n  ```\n\n* Get the build log of a specific store path:\n\n  ```console\n  # nix log /nix/store/lmngj4wcm9rkv3w4dfhzhcyij3195hiq-thunderbird-52.2.1\n  ```\n\n* Get a build log from a specific binary cache:\n\n  ```console\n  # nix log --store https://cache.nixos.org nixpkgs#hello\n  ```\n\n# Description\n\nThis command prints the log of a previous build of the derivation\n*installable* on standard output.\n\nNix looks for build logs in two places:\n\n* In the directory `/nix/var/log/nix/drvs`, which contains logs for\n  locally built derivations.\n\n* In the binary caches listed in the `substituters` setting. Logs\n  should be named `<cache>/log/<base-name-of-store-path>`, where\n  `store-path` is a derivation,\n  e.g. `https://cache.nixos.org/log/dvmig8jgrdapvbyxb1rprckdmdqx08kv-hello-2.10.drv`.\n  For non-derivation store paths, Nix will first try to determine the\n  deriver by fetching the `.narinfo` file for this store path.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"nar":{"args":[{"arity":1,"label":"subcommand","optional":true}],"category":{"description":"Utility/scripting commands","id":101},"commands":{"cat":{"args":[{"arity":1,"label":"nar","optional":false},{"arity":1,"label":"path","optional":false}],"category":{"description":"Available commands","id":0},"description":"print the contents of a file inside a NAR file on stdout","doc":"\n\n# Examples\n\n* List a file in a NAR and pipe it through `gunzip`:\n\n  ```console\n  # nix nar cat ./hello.nar /share/man/man1/hello.1.gz | gunzip\n  .\\\" DO NOT MODIFY THIS FILE!  It was generated by help2man 1.46.4.\n  .TH HELLO \"1\" \"November 2014\" \"hello 2.10\" \"User Commands\"\n  …\n  ```\n\n# Description\n\nThis command prints on standard output the contents of the regular\nfile *path* inside the NAR file *nar*.\n\n","flags":{}},"dump-path":{"args":[{"arity":1,"label":"path","optional":false}],"category":{"description":"Available commands","id":0},"description":"serialise a path to stdout in NAR format","doc":"\n\n# Examples\n\n* To serialise directory `foo` as a NAR:\n\n  ```console\n  # nix nar dump-path ./foo > foo.nar\n  ```\n\n# Description\n\nThis command generates a NAR file containing the serialisation of\n*path*, which must contain only regular files, directories and\nsymbolic links. The NAR is written to standard output.\n\n","flags":{}},"ls":{"args":[{"arity":1,"label":"nar","optional":false},{"arity":1,"label":"path","optional":false}],"category":{"description":"Available commands","id":0},"description":"show information about a path inside a NAR file","doc":"\n\n# Examples\n\n* To list a specific file in a NAR:\n\n  ```console\n  # nix nar ls -l ./hello.nar /bin/hello\n  -r-xr-xr-x                38184 hello\n  ```\n\n* To recursively list the contents of a directory inside a NAR, in JSON\n  format:\n\n  ```console\n  # nix nar ls --json -R ./hello.nar /bin\n  {\"type\":\"directory\",\"entries\":{\"hello\":{\"type\":\"regular\",\"size\":38184,\"executable\":true,\"narOffset\":400}}}\n  ```\n\n# Description\n\nThis command shows information about a *path* inside NAR file *nar*.\n\n","flags":{"directory":{"arity":0,"category":"","description":"Show directories rather than their contents.","shortName":"d"},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"long":{"arity":0,"category":"","description":"Show detailed file information.","shortName":"l"},"recursive":{"arity":0,"category":"","description":"List subdirectories recursively.","shortName":"R"}}}},"description":"create or inspect NAR files","doc":"\n\n# Description\n\n`nix nar` provides several subcommands for creating and inspecting\n*Nix Archives* (NARs).\n\n# File format\n\nFor the definition of the NAR file format, see Figure 5.2 in\nhttps://edolstra.github.io/pubs/phd-thesis.pdf.\n\n","flags":{}},"path-info":{"args":[{"label":"installables","optional":false}],"category":{"description":"Infrequently used commands","id":100},"description":"query information about store paths","doc":"\n\n# Examples\n\n* Print the store path produced by `nixpkgs#hello`:\n\n  ```console\n  # nix path-info nixpkgs#hello\n  /nix/store/v5sv61sszx301i0x6xysaqzla09nksnd-hello-2.10\n  ```\n\n* Show the closure sizes of every path in the current NixOS system\n  closure, sorted by size:\n\n  ```console\n  # nix path-info -rS /run/current-system | sort -nk2\n  /nix/store/hl5xwp9kdrd1zkm0idm3kkby9q66z404-empty                                                96\n  /nix/store/27324qvqhnxj3rncazmxc4mwy79kz8ha-nameservers                                         112\n  …\n  /nix/store/539jkw9a8dyry7clcv60gk6na816j7y8-etc                                          5783255504\n  /nix/store/zqamz3cz4dbzfihki2mk7a63mbkxz9xq-nixos-system-machine-20.09.20201112.3090c65  5887562256\n  ```\n\n* Show a package's closure size and all its dependencies with human\n  readable sizes:\n\n  ```console\n  # nix path-info -rsSh nixpkgs#rustc\n  /nix/store/01rrgsg5zk3cds0xgdsq40zpk6g51dz9-ncurses-6.2-dev      386.7K   69.1M\n  /nix/store/0q783wnvixpqz6dxjp16nw296avgczam-libpfm-4.11.0          5.9M   37.4M\n  …\n  ```\n\n* Check the existence of a path in a binary cache:\n\n  ```console\n  # nix path-info -r /nix/store/blzxgyvrk32ki6xga10phr4sby2xf25q-geeqie-1.5.1 --store https://cache.nixos.org/\n  path '/nix/store/blzxgyvrk32ki6xga10phr4sby2xf25q-geeqie-1.5.1' is not valid\n\n  ```\n\n* Print the 10 most recently added paths (using --json and the jq(1)\n  command):\n\n  ```console\n  # nix path-info --json --all | jq -r 'sort_by(.registrationTime)[-11:-1][].path'\n  ```\n\n* Show the size of the entire Nix store:\n\n  ```console\n  # nix path-info --json --all | jq 'map(.narSize) | add'\n  49812020936\n  ```\n\n* Show every path whose closure is bigger than 1 GB, sorted by closure\n  size:\n\n  ```console\n  # nix path-info --json --all -S \\\n    | jq 'map(select(.closureSize > 1e9)) | sort_by(.closureSize) | map([.path, .closureSize])'\n  [\n    …,\n    [\n      \"/nix/store/zqamz3cz4dbzfihki2mk7a63mbkxz9xq-nixos-system-machine-20.09.20201112.3090c65\",\n      5887562256\n    ]\n  ]\n  ```\n\n* Print the path of the store derivation produced by `nixpkgs#hello`:\n\n  ```console\n  # nix path-info --derivation nixpkgs#hello\n  /nix/store/s6rn4jz1sin56rf4qj5b5v8jxjm32hlk-hello-2.10.drv\n  ```\n\n# Description\n\nThis command shows information about the store paths produced by\n*installables*, or about all paths in the store if you pass `--all`.\n\nBy default, this command only prints the store paths. You can get\nadditional information by passing flags such as `--closure-size`,\n`--size`, `--sigs` or `--json`.\n\n> **Warning**\n>\n> Note that `nix path-info` does not build or substitute the\n> *installables* you specify. Thus, if the corresponding store paths\n> don't already exist, this command will fail. You can use `nix build`\n> to ensure that they exist.\n\n","flags":{"all":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply the operation to every store path."},"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"closure-size":{"arity":0,"category":"","description":"Print the sum of the sizes of the NAR serialisations of the closure of each path.","shortName":"S"},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"human-readable":{"arity":0,"category":"","description":"With `-s` and `-S`, print sizes in a human-friendly format such as `5.67G`.","shortName":"h"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"recursive":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply operation to closure of the specified paths.","shortName":"r"},"sigs":{"arity":0,"category":"","description":"Show signatures."},"size":{"arity":0,"category":"","description":"Print the size of the NAR serialisation of each path.","shortName":"s"},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"print-dev-env":{"args":[{"arity":1,"label":"installable","optional":true}],"category":{"description":"Utility/scripting commands","id":101},"description":"print shell code that can be sourced by bash to reproduce the build environment of a derivation","doc":"\n\n# Examples\n\n* Apply the build environment of GNU hello to the current shell:\n\n  ```console\n  # . <(nix print-dev-env nixpkgs#hello)\n  ```\n\n* Get the build environment in JSON format:\n\n  ```console\n  # nix print-dev-env nixpkgs#hello --json\n  ```\n\n  The output will look like this:\n\n  ```json\n  {\n    \"bashFunctions\": {\n      \"buildPhase\": \" \\n    runHook preBuild;\\n...\",\n      ...\n    },\n    \"variables\": {\n      \"src\": {\n        \"type\": \"exported\",\n        \"value\": \"/nix/store/3x7dwzq014bblazs7kq20p9hyzz0qh8g-hello-2.10.tar.gz\"\n      },\n      \"postUnpackHooks\": {\n        \"type\": \"array\",\n        \"value\": [\"_updateSourceDateEpochFromSourceRoot\"]\n      },\n      ...\n    }\n  }\n  ```\n\n# Description\n\nThis command prints a shell script that can be sourced by `bash` and\nthat sets the variables and shell functions defined by the build\nprocess of *installable*. This allows you to get a similar build\nenvironment in your current shell rather than in a subshell (as with\n`nix develop`).\n\nWith `--json`, the output is a JSON serialisation of the variables and\nfunctions defined by the build process.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"profile":{"arity":1,"category":"","description":"The profile to operate on.","labels":["path"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"redirect":{"arity":2,"category":"","description":"Redirect a store path to a mutable location.","labels":["installable","outputs-dir"]},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"profile":{"args":[{"arity":1,"label":"subcommand","optional":true}],"category":{"description":"Main commands","id":0},"commands":{"diff-closures":{"args":[],"category":{"description":"Available commands","id":0},"description":"show the closure difference between each version of a profile","doc":"\n\n# Examples\n\n* Show what changed between each version of the NixOS system\n  profile:\n\n  ```console\n  # nix profile diff-closures --profile /nix/var/nix/profiles/system\n  Version 13 -> 14:\n    acpi-call: 2020-04-07-5.8.13 → 2020-04-07-5.8.14\n    aws-sdk-cpp: -6723.1 KiB\n    …\n\n  Version 14 -> 15:\n    acpi-call: 2020-04-07-5.8.14 → 2020-04-07-5.8.16\n    attica: -996.2 KiB\n    breeze-icons: -78713.5 KiB\n    brotli: 1.0.7 → 1.0.9, +44.2 KiB\n  ```\n\n# Description\n\nThis command shows the difference between the closures of subsequent\nversions of a profile. See [`nix store\ndiff-closures`](nix3-store-diff-closures.md) for details.\n\n","flags":{"profile":{"arity":1,"category":"","description":"The profile to operate on.","labels":["path"]}}},"history":{"args":[],"category":{"description":"Available commands","id":0},"description":"show all versions of a profile","doc":"\n\n# Examples\n\n* Show the changes between each version of your default profile:\n\n  ```console\n  # nix profile history\n  Version 508 (2020-04-10):\n    flake:nixpkgs#legacyPackages.x86_64-linux.awscli: ∅ -> 1.17.13\n\n  Version 509 (2020-05-16) <- 508:\n    flake:nixpkgs#legacyPackages.x86_64-linux.awscli: 1.17.13 -> 1.18.211\n  ```\n\n# Description\n\nThis command shows what packages were added, removed or upgraded\nbetween subsequent versions of a profile. It only shows top-level\npackages, not dependencies; for that, use [`nix profile\ndiff-closures`](./nix3-profile-diff-closures.md).\n\nThe addition of a package to a profile is denoted by the string `∅ ->`\n*version*, whereas the removal is denoted by *version* `-> ∅`.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"profile":{"arity":1,"category":"","description":"The profile to operate on.","labels":["path"]}}},"install":{"args":[{"label":"installables","optional":false}],"category":{"description":"Available commands","id":0},"description":"install a package into a profile","doc":"\n\n# Examples\n\n* Install a package from Nixpkgs:\n\n  ```console\n  # nix profile install nixpkgs#hello\n  ```\n\n* Install a package from a specific branch of Nixpkgs:\n\n  ```console\n  # nix profile install nixpkgs/release-20.09#hello\n  ```\n\n* Install a package from a specific revision of Nixpkgs:\n\n  ```console\n  # nix profile install nixpkgs/d73407e8e6002646acfdef0e39ace088bacc83da#hello\n  ```\n\n* Install a specific output of a package:\n\n  ```console\n  # nix profile install nixpkgs#bash^man\n  ```\n\n\n# Description\n\nThis command adds *installables* to a Nix profile.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"priority":{"arity":1,"category":"","description":"The priority of the package to install.","labels":["priority"]},"profile":{"arity":1,"category":"","description":"The profile to operate on.","labels":["path"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"list":{"args":[],"category":{"description":"Available commands","id":0},"description":"list installed packages","doc":"\n\n# Examples\n\n* Show what packages are installed in the default profile:\n\n  ```console\n  # nix profile list\n  0 flake:nixpkgs#legacyPackages.x86_64-linux.spotify github:NixOS/nixpkgs/c23db78bbd474c4d0c5c3c551877523b4a50db06#legacyPackages.x86_64-linux.spotify /nix/store/akpdsid105phbbvknjsdh7hl4v3fhjkr-spotify-1.1.46.916.g416cacf1\n  1 flake:nixpkgs#legacyPackages.x86_64-linux.zoom-us github:NixOS/nixpkgs/c23db78bbd474c4d0c5c3c551877523b4a50db06#legacyPackages.x86_64-linux.zoom-us /nix/store/89pmjmbih5qpi7accgacd17ybpgp4xfm-zoom-us-5.4.53350.1027\n  2 flake:blender-bin#packages.x86_64-linux.default github:edolstra/nix-warez/d09d7eea893dcb162e89bc67f6dc1ced14abfc27?dir=blender#packages.x86_64-linux.default /nix/store/zfgralhqjnam662kqsgq6isjw8lhrflz-blender-bin-2.91.0\n  ```\n\n# Description\n\nThis command shows what packages are currently installed in a\nprofile. The output consists of one line per package, with the\nfollowing fields:\n\n* An integer that can be used to unambiguously identify the package in\n  invocations of `nix profile remove` and `nix profile upgrade`.\n\n* The original (\"mutable\") flake reference and output attribute path\n  used at installation time.\n\n* The immutable flake reference to which the mutable flake reference\n  was resolved.\n\n* The store path(s) of the package.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"profile":{"arity":1,"category":"","description":"The profile to operate on.","labels":["path"]}}},"remove":{"args":[{"label":"elements","optional":false}],"category":{"description":"Available commands","id":0},"description":"remove packages from a profile","doc":"\n\n# Examples\n\n* Remove a package by position:\n\n  ```console\n  # nix profile remove 3\n  ```\n\n* Remove a package by attribute path:\n\n  ```console\n  # nix profile remove packages.x86_64-linux.hello\n  ```\n\n* Remove all packages:\n\n  ```console\n  # nix profile remove '.*'\n  ```\n\n* Remove a package by store path:\n\n  ```console\n  # nix profile remove /nix/store/rr3y0c6zyk7kjjl8y19s4lsrhn4aiq1z-hello-2.10\n  ```\n\n# Description\n\nThis command removes a package from a profile.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"profile":{"arity":1,"category":"","description":"The profile to operate on.","labels":["path"]}}},"rollback":{"args":[],"category":{"description":"Available commands","id":0},"description":"roll back to the previous version or a specified version of a profile","doc":"\n\n# Examples\n\n* Roll back your default profile to the previous version:\n\n  ```console\n  # nix profile rollback\n  switching profile from version 519 to 518\n  ```\n\n* Switch your default profile to version 510:\n\n  ```console\n  # nix profile rollback --to 510\n  switching profile from version 518 to 510\n  ```\n\n# Description\n\nThis command switches a profile to the most recent version older\nthan the currently active version, or if `--to` *N* is given, to\nversion *N* of the profile. To see the available versions of a\nprofile, use `nix profile history`.\n\n","flags":{"dry-run":{"arity":0,"category":"","description":"Show what this command would do without doing it."},"profile":{"arity":1,"category":"","description":"The profile to operate on.","labels":["path"]},"to":{"arity":1,"category":"","description":"The profile version to roll back to.","labels":["version"]}}},"upgrade":{"args":[{"label":"elements","optional":false}],"category":{"description":"Available commands","id":0},"description":"upgrade packages using their most recent flake","doc":"\n\n# Examples\n\n* Upgrade all packages that were installed using a mutable flake\n  reference:\n\n  ```console\n  # nix profile upgrade '.*'\n  ```\n\n* Upgrade a specific package:\n\n  ```console\n  # nix profile upgrade packages.x86_64-linux.hello\n  ```\n\n* Upgrade a specific profile element by number:\n\n  ```console\n  # nix profile list\n  0 flake:nixpkgs#legacyPackages.x86_64-linux.spotify …\n\n  # nix profile upgrade 0\n  ```\n\n# Description\n\nThis command upgrades a previously installed package in a Nix profile,\nby fetching and evaluating the latest version of the flake from which\nthe package was installed.\n\n> **Warning**\n>\n> This only works if you used a *mutable* flake reference at\n> installation time, e.g. `nixpkgs#hello`. It does not work if you\n> used an *immutable* flake reference\n> (e.g. `github:NixOS/nixpkgs/13d0c311e3ae923a00f734b43fd1d35b47d8943a#hello`),\n> since in that case the \"latest version\" is always the same.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"profile":{"arity":1,"category":"","description":"The profile to operate on.","labels":["path"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"wipe-history":{"args":[],"category":{"description":"Available commands","id":0},"description":"delete non-current versions of a profile","doc":"\n\n# Examples\n\n* Delete all versions of the default profile older than 100 days:\n\n  ```console\n  # nix profile wipe-history --profile /tmp/profile --older-than 100d\n  removing profile version 515\n  removing profile version 514\n  ```\n\n# Description\n\nThis command deletes non-current versions of a profile, making it\nimpossible to roll back to these versions. By default, all non-current\nversions are deleted. With `--older-than` *N*`d`, all non-current\nversions older than *N* days are deleted.\n\n","flags":{"dry-run":{"arity":0,"category":"","description":"Show what this command would do without doing it."},"older-than":{"arity":1,"category":"","description":"Delete versions older than the specified age. *age* must be in the format *N*`d`, where *N* denotes a number of days.","labels":["age"]},"profile":{"arity":1,"category":"","description":"The profile to operate on.","labels":["path"]}}}},"description":"manage Nix profiles","doc":"\n\n# Description\n\n`nix profile` allows you to create and manage *Nix profiles*. A Nix\nprofile is a set of packages that can be installed and upgraded\nindependently from each other. Nix profiles are versioned, allowing\nthem to be rolled back easily.\n\n# Default profile\n\nThe default profile used by `nix profile` is `$HOME/.nix-profile`,\nwhich, if it does not exist, is created as a symlink to\n`/nix/var/nix/profiles/default` if Nix is invoked by the\n`root` user, or `/nix/var/nix/profiles/per-user/`*username* otherwise.\n\nYou can specify another profile location using `--profile` *path*.\n\n# Filesystem layout\n\nProfiles are versioned as follows. When using profile *path*, *path*\nis a symlink to *path*`-`*N*, where *N* is the current *version* of\nthe profile. In turn, *path*`-`*N* is a symlink to a path in the Nix\nstore. For example:\n\n```console\n$ ls -l /nix/var/nix/profiles/per-user/alice/profile*\nlrwxrwxrwx 1 alice users 14 Nov 25 14:35 /nix/var/nix/profiles/per-user/alice/profile -> profile-7-link\nlrwxrwxrwx 1 alice users 51 Oct 28 16:18 /nix/var/nix/profiles/per-user/alice/profile-5-link -> /nix/store/q69xad13ghpf7ir87h0b2gd28lafjj1j-profile\nlrwxrwxrwx 1 alice users 51 Oct 29 13:20 /nix/var/nix/profiles/per-user/alice/profile-6-link -> /nix/store/6bvhpysd7vwz7k3b0pndn7ifi5xr32dg-profile\nlrwxrwxrwx 1 alice users 51 Nov 25 14:35 /nix/var/nix/profiles/per-user/alice/profile-7-link -> /nix/store/mp0x6xnsg0b8qhswy6riqvimai4gm677-profile\n```\n\nEach of these symlinks is a root for the Nix garbage collector.\n\nThe contents of the store path corresponding to each version of the\nprofile is a tree of symlinks to the files of the installed packages,\ne.g.\n\n```console\n$ ll -R /nix/var/nix/profiles/per-user/eelco/profile-7-link/\n/nix/var/nix/profiles/per-user/eelco/profile-7-link/:\ntotal 20\ndr-xr-xr-x 2 root root 4096 Jan  1  1970 bin\n-r--r--r-- 2 root root 1402 Jan  1  1970 manifest.json\ndr-xr-xr-x 4 root root 4096 Jan  1  1970 share\n\n/nix/var/nix/profiles/per-user/eelco/profile-7-link/bin:\ntotal 20\nlrwxrwxrwx 5 root root 79 Jan  1  1970 chromium -> /nix/store/ijm5k0zqisvkdwjkc77mb9qzb35xfi4m-chromium-86.0.4240.111/bin/chromium\nlrwxrwxrwx 7 root root 87 Jan  1  1970 spotify -> /nix/store/w9182874m1bl56smps3m5zjj36jhp3rn-spotify-1.1.26.501.gbe11e53b-15/bin/spotify\nlrwxrwxrwx 3 root root 79 Jan  1  1970 zoom-us -> /nix/store/wbhg2ga8f3h87s9h5k0slxk0m81m4cxl-zoom-us-5.3.469451.0927/bin/zoom-us\n\n/nix/var/nix/profiles/per-user/eelco/profile-7-link/share/applications:\ntotal 12\nlrwxrwxrwx 4 root root 120 Jan  1  1970 chromium-browser.desktop -> /nix/store/4cf803y4vzfm3gyk3vzhzb2327v0kl8a-chromium-unwrapped-86.0.4240.111/share/applications/chromium-browser.desktop\nlrwxrwxrwx 7 root root 110 Jan  1  1970 spotify.desktop -> /nix/store/w9182874m1bl56smps3m5zjj36jhp3rn-spotify-1.1.26.501.gbe11e53b-15/share/applications/spotify.desktop\nlrwxrwxrwx 3 root root 107 Jan  1  1970 us.zoom.Zoom.desktop -> /nix/store/wbhg2ga8f3h87s9h5k0slxk0m81m4cxl-zoom-us-5.3.469451.0927/share/applications/us.zoom.Zoom.desktop\n\n…\n```\n\nThe file `manifest.json` records the provenance of the packages that\nare installed in this version of the profile. It looks like this:\n\n```json\n{\n  \"version\": 1,\n  \"elements\": [\n    {\n      \"active\": true,\n      \"attrPath\": \"legacyPackages.x86_64-linux.zoom-us\",\n      \"originalUrl\": \"flake:nixpkgs\",\n      \"storePaths\": [\n        \"/nix/store/wbhg2ga8f3h87s9h5k0slxk0m81m4cxl-zoom-us-5.3.469451.0927\"\n      ],\n      \"uri\": \"github:NixOS/nixpkgs/13d0c311e3ae923a00f734b43fd1d35b47d8943a\"\n    },\n    …\n  ]\n}\n```\n\nEach object in the array `elements` denotes an installed package and\nhas the following fields:\n\n* `originalUrl`: The [flake reference](./nix3-flake.md) specified by\n  the user at the time of installation (e.g. `nixpkgs`). This is also\n  the flake reference that will be used by `nix profile upgrade`.\n\n* `uri`: The immutable flake reference to which `originalUrl`\n  resolved.\n\n* `attrPath`: The flake output attribute that provided this\n  package. Note that this is not necessarily the attribute that the\n  user specified, but the one resulting from applying the default\n  attribute paths and prefixes; for instance, `hello` might resolve to\n  `packages.x86_64-linux.hello` and the empty string to\n  `packages.x86_64-linux.default`.\n\n* `storePath`: The paths in the Nix store containing the package.\n\n* `active`: Whether the profile contains symlinks to the files of this\n  package. If set to false, the package is kept in the Nix store, but\n  is not \"visible\" in the profile's symlink tree.\n\n","flags":{}},"realisation":{"args":[{"arity":1,"label":"subcommand","optional":true}],"category":{"description":"Utility/scripting commands","id":101},"commands":{"info":{"args":[{"label":"installables","optional":false}],"category":{"description":"","id":100},"description":"query information about one or several realisations","doc":"\n# Description\n\nDisplay some information about the given realisation\n\n# Examples\n\nShow some information about the realisation of the `hello` package:\n\n```console\n$ nix realisation info nixpkgs#hello --json\n[{\"id\":\"sha256:3d382378a00588e064ee30be96dd0fa7e7df7cf3fbcace85a0e7b7dada1eef25!out\",\"outPath\":\"fd3m7xawvrqcg98kgz5hc2vk3x9q0lh7-hello\"}]\n```\n\n","flags":{"all":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply the operation to every store path."},"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"recursive":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply operation to closure of the specified paths.","shortName":"r"},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}}},"description":"manipulate a Nix realisation","flags":{}},"registry":{"args":[{"arity":1,"label":"subcommand","optional":true}],"category":{"description":"Infrequently used commands","id":100},"commands":{"add":{"args":[{"arity":1,"label":"from-url","optional":false},{"arity":1,"label":"to-url","optional":false}],"category":{"description":"Available commands","id":0},"description":"add/replace flake in user flake registry","doc":"\n\n# Examples\n\n* Set the `nixpkgs` flake identifier to a specific branch of Nixpkgs:\n\n  ```console\n  # nix registry add nixpkgs github:NixOS/nixpkgs/nixos-20.03\n  ```\n\n* Pin `nixpkgs` to a specific revision:\n\n  ```console\n  # nix registry add nixpkgs github:NixOS/nixpkgs/925b70cd964ceaedee26fde9b19cc4c4f081196a\n  ```\n\n* Add an entry that redirects a specific branch of `nixpkgs` to\n  another fork:\n\n  ```console\n  # nix registry add nixpkgs/nixos-20.03 ~/Dev/nixpkgs\n  ```\n\n* Add `nixpkgs` pointing to `github:nixos/nixpkgs` to your custom flake\n  registry:\n\n  ```console\n  nix registry add --registry ./custom-flake-registry.json nixpkgs github:nixos/nixpkgs\n  ```\n\n# Description\n\nThis command adds an entry to the user registry that maps flake\nreference *from-url* to flake reference *to-url*. If an entry for\n*from-url* already exists, it is overwritten.\n\nEntries can be removed using [`nix registry\nremove`](./nix3-registry-remove.md).\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"registry":{"arity":1,"category":"","description":"The registry to operate on.","labels":["registry"]}}},"list":{"args":[],"category":{"description":"Available commands","id":0},"description":"list available Nix flakes","doc":"\n\n# Examples\n\n* Show the contents of all registries:\n\n  ```console\n  # nix registry list\n  user   flake:dwarffs github:edolstra/dwarffs/d181d714fd36eb06f4992a1997cd5601e26db8f5\n  system flake:nixpkgs path:/nix/store/fxl9mrm5xvzam0lxi9ygdmksskx4qq8s-source?lastModified=1605220118&narHash=sha256-Und10ixH1WuW0XHYMxxuHRohKYb45R%2fT8CwZuLd2D2Q=&rev=3090c65041104931adda7625d37fa874b2b5c124\n  global flake:blender-bin github:edolstra/nix-warez?dir=blender\n  global flake:dwarffs github:edolstra/dwarffs\n  …\n  ```\n\n# Description\n\nThis command displays the contents of all registries on standard\noutput. Each line represents one registry entry in the format *type*\n*from* *to*, where *type* denotes the registry containing the entry:\n\n* `flags`: entries specified on the command line using `--override-flake`.\n* `user`: the user registry.\n* `system`: the system registry.\n* `global`: the global registry.\n\nSee the [`nix registry` manual page](./nix3-registry.md) for more details.\n\n","flags":{}},"pin":{"args":[{"arity":1,"label":"url","optional":false},{"arity":1,"label":"locked","optional":true}],"category":{"description":"Available commands","id":0},"description":"pin a flake to its current version or to the current version of a flake URL","doc":"\n\n# Examples\n\n* Pin `nixpkgs` to its most recent Git revision:\n\n  ```console\n  # nix registry pin nixpkgs\n  ```\n\n  Afterwards the user registry will have an entry like this:\n\n  ```console\n  nix registry list | grep '^user '\n  user   flake:nixpkgs github:NixOS/nixpkgs/925b70cd964ceaedee26fde9b19cc4c4f081196a\n  ```\n\n  and `nix flake info` will say:\n\n  ```console\n  # nix flake info nixpkgs\n  Resolved URL:  github:NixOS/nixpkgs/925b70cd964ceaedee26fde9b19cc4c4f081196a\n  Locked URL:    github:NixOS/nixpkgs/925b70cd964ceaedee26fde9b19cc4c4f081196a\n  …\n  ```\n\n* Pin `nixpkgs` in a custom registry to its most recent Git revision:\n\n  ```console\n  # nix registry pin --registry ./custom-flake-registry.json nixpkgs\n  ```\n\n\n# Description\n\nThis command adds an entry to the user registry that maps flake\nreference *url* to the corresponding *locked* flake reference, that\nis, a flake reference that specifies an exact revision or content\nhash. This ensures that until this registry entry is removed, all uses\nof *url* will resolve to exactly the same flake.\n\nEntries can be removed using [`nix registry\nremove`](./nix3-registry-remove.md).\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"registry":{"arity":1,"category":"","description":"The registry to operate on.","labels":["registry"]}}},"remove":{"args":[{"arity":1,"label":"url","optional":false}],"category":{"description":"Available commands","id":0},"description":"remove flake from user flake registry","doc":"\n\n# Examples\n\n* Remove the entry `nixpkgs` from the user registry:\n\n  ```console\n  # nix registry remove nixpkgs\n  ```\n\n* Remove the entry `nixpkgs` from a custom registry:\n\n  ```console\n  # nix registry remove --registry ./custom-flake-registry.json nixpkgs\n  ```\n\n# Description\n\nThis command removes from the user registry any entry for flake\nreference *url*.\n\n","flags":{"registry":{"arity":1,"category":"","description":"The registry to operate on.","labels":["registry"]}}}},"description":"manage the flake registry","doc":"\n\n# Description\n\n`nix registry` provides subcommands for managing *flake\nregistries*. Flake registries are a convenience feature that allows\nyou to refer to flakes using symbolic identifiers such as `nixpkgs`,\nrather than full URLs such as `git://github.com/NixOS/nixpkgs`. You\ncan use these identifiers on the command line (e.g. when you do `nix\nrun nixpkgs#hello`) or in flake input specifications in `flake.nix`\nfiles. The latter are automatically resolved to full URLs and recorded\nin the flake's `flake.lock` file.\n\nIn addition, the flake registry allows you to redirect arbitrary flake\nreferences (e.g. `github:NixOS/patchelf`) to another location, such as\na local fork.\n\nThere are multiple registries. These are, in order from lowest to\nhighest precedence:\n\n* The global registry, which is a file downloaded from the URL\n  specified by the setting `flake-registry`. It is cached locally and\n  updated automatically when it's older than `tarball-ttl`\n  seconds. The default global registry is kept in [a GitHub\n  repository](https://github.com/NixOS/flake-registry).\n\n* The system registry, which is shared by all users. The default\n  location is `/etc/nix/registry.json`. On NixOS, the system registry\n  can be specified using the NixOS option `nix.registry`.\n\n* The user registry `~/.config/nix/registry.json`. This registry can\n  be modified by commands such as `nix registry pin`.\n\n* Overrides specified on the command line using the option\n  `--override-flake`.\n\n# Registry format\n\nA registry is a JSON file with the following format:\n\n```json\n{\n  \"version\": 2,\n  \"flakes\": [\n    {\n      \"from\": {\n        \"type\": \"indirect\",\n        \"id\": \"nixpkgs\"\n      },\n      \"to\": {\n        \"type\": \"github\",\n        \"owner\": \"NixOS\",\n        \"repo\": \"nixpkgs\"\n      }\n    },\n    ...\n  ]\n}\n```\n\nThat is, it contains a list of objects with attributes `from` and\n`to`, both of which contain a flake reference in attribute\nrepresentation. (For example, `{\"type\": \"indirect\", \"id\": \"nixpkgs\"}`\nis the attribute representation of `nixpkgs`, while `{\"type\":\n\"github\", \"owner\": \"NixOS\", \"repo\": \"nixpkgs\"}` is the attribute\nrepresentation of `github:NixOS/nixpkgs`.)\n\nGiven some flake reference *R*, a registry entry is used if its\n`from` flake reference *matches* *R*. *R* is then replaced by the\n*unification* of the `to` flake reference with *R*.\n\n# Matching\n\nThe `from` flake reference in a registry entry *matches* some flake\nreference *R* if the attributes in `from` are the same as the\nattributes in `R`. For example:\n\n* `nixpkgs` matches with `nixpkgs`.\n\n* `nixpkgs` matches with `nixpkgs/nixos-20.09`.\n\n* `nixpkgs/nixos-20.09` does not match with `nixpkgs`.\n\n* `nixpkgs` does not match with `git://github.com/NixOS/patchelf`.\n\n# Unification\n\nThe `to` flake reference in a registry entry is *unified* with some flake\nreference *R* by taking `to` and applying the `rev` and `ref`\nattributes from *R*, if specified. For example:\n\n* `github:NixOS/nixpkgs` unified with `nixpkgs` produces `github:NixOS/nixpkgs`.\n\n* `github:NixOS/nixpkgs` unified with `nixpkgs/nixos-20.09` produces `github:NixOS/nixpkgs/nixos-20.09`.\n\n* `github:NixOS/nixpkgs/master` unified with `nixpkgs/nixos-20.09` produces `github:NixOS/nixpkgs/nixos-20.09`.\n\n","flags":{}},"repl":{"args":[{"label":"installables","optional":false}],"category":{"description":"Main commands","id":0},"description":"start an interactive environment for evaluating Nix expressions","doc":"\n\n# Examples\n\n* Display all special commands within the REPL:\n\n  ```console\n  # nix repl\n  nix-repl> :?\n  ```\n\n* Evaluate some simple Nix expressions:\n\n  ```console\n  # nix repl\n\n  nix-repl> 1 + 2\n  3\n\n  nix-repl> map (x: x * 2) [1 2 3]\n  [ 2 4 6 ]\n  ```\n\n* Interact with Nixpkgs in the REPL:\n\n  ```console\n  # nix repl --file example.nix\n  Loading Installable ''...\n  Added 3 variables.\n\n  # nix repl --expr '{a={b=3;c=4;};}'\n  Loading Installable ''...\n  Added 1 variables.\n\n  # nix repl --expr '{a={b=3;c=4;};}' a\n  Loading Installable ''...\n  Added 1 variables.\n\n  # nix repl --extra-experimental-features 'flakes repl-flake' nixpkgs\n  Loading Installable 'flake:nixpkgs#'...\n  Added 5 variables.\n\n  nix-repl> legacyPackages.x86_64-linux.emacs.name\n  \"emacs-27.1\"\n\n  nix-repl> legacyPackages.x86_64-linux.emacs.name\n  \"emacs-27.1\"\n\n  nix-repl> :q\n\n  # nix repl --expr 'import <nixpkgs>{}'\n\n  Loading Installable ''...\n  Added 12439 variables.\n\n  nix-repl> emacs.name\n  \"emacs-27.1\"\n\n  nix-repl> emacs.drvPath\n  \"/nix/store/lp0sjrhgg03y2n0l10n70rg0k7hhyz0l-emacs-27.1.drv\"\n\n  nix-repl> drv = runCommand \"hello\" { buildInputs = [ hello ]; } \"hello; hello > $out\"\n\n  nix-repl> :b drv\n  this derivation produced the following outputs:\n    out -> /nix/store/0njwbgwmkwls0w5dv9mpc1pq5fj39q0l-hello\n\n  nix-repl> builtins.readFile drv\n  \"Hello, world!\\n\"\n\n  nix-repl> :log drv\n  Hello, world!\n  ```\n\n# Description\n\nThis command provides an interactive environment for evaluating Nix\nexpressions. (REPL stands for 'read–eval–print loop'.)\n\nOn startup, it loads the Nix expressions named *files* and adds them\ninto the lexical scope. You can load addition files using the `:l\n<filename>` command, or reload all files using `:r`.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"run":{"args":[{"arity":1,"label":"installable","optional":true},{"label":"args","optional":false}],"category":{"description":"Main commands","id":0},"description":"run a Nix application","doc":"\n\n# Examples\n\n* Run the default app from the `blender-bin` flake:\n\n  ```console\n  # nix run blender-bin\n  ```\n\n* Run a non-default app from the `blender-bin` flake:\n\n  ```console\n  # nix run blender-bin#blender_2_83\n  ```\n\n  Tip: you can find apps provided by this flake by running `nix flake\n  show blender-bin`.\n\n* Run `vim` from the `nixpkgs` flake:\n\n  ```console\n  # nix run nixpkgs#vim\n  ```\n\n  Note that `vim` (as of the time of writing of this page) is not an\n  app but a package. Thus, Nix runs the eponymous file from the `vim`\n  package.\n\n* Run `vim` with arguments:\n\n  ```console\n  # nix run nixpkgs#vim -- --help\n  ```\n\n# Description\n\n`nix run` builds and runs *installable*, which must evaluate to an\n*app* or a regular Nix derivation.\n\nIf *installable* evaluates to an *app* (see below), it executes the\nprogram specified by the app definition.\n\nIf *installable* evaluates to a derivation, it will try to execute the\nprogram `<out>/bin/<name>`, where *out* is the primary output store\npath of the derivation, and *name* is the first of the following that\nexists:\n\n* The `meta.mainProgram` attribute of the derivation.\n* The `pname` attribute of the derivation.\n* The name part of the value of the `name` attribute of the derivation.\n\nFor instance, if `name` is set to `hello-1.10`, `nix run` will run\n`$out/bin/hello`.\n\n# Flake output attributes\n\nIf no flake output attribute is given, `nix run` tries the following\nflake output attributes:\n\n* `apps.<system>.default`\n\n* `packages.<system>.default`\n\nIf an attribute *name* is given, `nix run` tries the following flake\noutput attributes:\n\n* `apps.<system>.<name>`\n\n* `packages.<system>.<name>`\n\n* `legacyPackages.<system>.<name>`\n\n# Apps\n\nAn app is specified by a flake output attribute named\n`apps.<system>.<name>`. It looks like this:\n\n```nix\napps.x86_64-linux.blender_2_79 = {\n  type = \"app\";\n  program = \"${self.packages.x86_64-linux.blender_2_79}/bin/blender\";\n};\n```\n\nThe only supported attributes are:\n\n* `type` (required): Must be set to `app`.\n\n* `program` (required): The full path of the executable to run. It\n  must reside in the Nix store.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"search":{"args":[{"arity":1,"label":"installable","optional":true},{"label":"regex","optional":false}],"category":{"description":"Main commands","id":0},"description":"search for packages","doc":"\n\n# Examples\n\n* Show all packages in the `nixpkgs` flake:\n\n  ```console\n  # nix search nixpkgs\n  * legacyPackages.x86_64-linux.AMB-plugins (0.8.1)\n    A set of ambisonics ladspa plugins\n\n  * legacyPackages.x86_64-linux.ArchiSteamFarm (4.3.1.0)\n    Application with primary purpose of idling Steam cards from multiple accounts simultaneously\n  …\n  ```\n\n* Show packages in the `nixpkgs` flake containing `blender` in its\n  name or description:\n\n  ```console\n  # nix search nixpkgs blender\n  * legacyPackages.x86_64-linux.blender (2.91.0)\n    3D Creation/Animation/Publishing System\n  ```\n\n* Search for packages underneath the attribute `gnome3` in Nixpkgs:\n\n  ```console\n  # nix search nixpkgs#gnome3 vala\n  * legacyPackages.x86_64-linux.gnome3.vala (0.48.9)\n    Compiler for GObject type system\n  ```\n\n* Show all packages in the flake in the current directory:\n\n  ```console\n  # nix search\n  ```\n\n* Search for Firefox or Chromium:\n\n  ```console\n  # nix search nixpkgs 'firefox|chromium'\n  ```\n\n* Search for packages containing `git` and either `frontend` or `gui`:\n\n  ```console\n  # nix search nixpkgs git 'frontend|gui'\n  ```\n\n* Search for packages containing `neovim` but hide ones containing either `gui` or `python`:\n\n  ```console\n  # nix search nixpkgs neovim -e 'python|gui'\n  ```\n  or\n\n  ```console\n  # nix search nixpkgs neovim -e 'python' -e 'gui'\n  ```\n\n# Description\n\n`nix search` searches *installable* (which must be evaluatable, e.g. a\nflake) for packages whose name or description matches all of the\nregular expressions *regex*.  For each matching package, It prints the\nfull attribute name (from the root of the installable), the version\nand the `meta.description` field, highlighting the substrings that\nwere matched by the regular expressions. If no regular expressions are\nspecified, all packages are shown.\n\n# Flake output attributes\n\nIf no flake output attribute is given, `nix search` searches for\npackages:\n\n* Directly underneath `packages.<system>`.\n\n* Underneath `legacyPackages.<system>`, recursing into attribute sets\n  that contain an attribute `recurseForDerivations = true`.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"exclude":{"arity":1,"category":"","description":"Hide packages whose attribute path, name or description contain *regex*.","labels":["regex"],"shortName":"e"},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"shell":{"args":[{"label":"installables","optional":false}],"category":{"description":"Main commands","id":0},"description":"run a shell in which the specified packages are available","doc":"\n\n# Examples\n\n* Start a shell providing `youtube-dl` from the `nixpkgs` flake:\n\n  ```console\n  # nix shell nixpkgs#youtube-dl\n  # youtube-dl --version\n  2020.11.01.1\n  ```\n\n* Start a shell providing GNU Hello from NixOS 20.03:\n\n  ```console\n  # nix shell nixpkgs/nixos-20.03#hello\n  ```\n\n* Run GNU Hello:\n\n  ```console\n  # nix shell nixpkgs#hello -c hello --greeting 'Hi everybody!'\n  Hi everybody!\n  ```\n\n* Run multiple commands in a shell environment:\n\n  ```console\n  # nix shell nixpkgs#gnumake -c sh -c \"cd src && make\"\n  ```\n\n* Run GNU Hello in a chroot store:\n\n  ```console\n  # nix shell --store ~/my-nix nixpkgs#hello -c hello\n  ```\n\n* Start a shell providing GNU Hello in a chroot store:\n\n  ```console\n  # nix shell --store ~/my-nix nixpkgs#hello nixpkgs#bashInteractive -c bash\n  ```\n\n  Note that it's necessary to specify `bash` explicitly because your\n  default shell (e.g. `/bin/bash`) generally will not exist in the\n  chroot.\n\n# Description\n\n`nix shell` runs a command in an environment in which the `$PATH` variable\nprovides the specified *installables*. If no command is specified, it starts the\ndefault shell of your user account specified by `$SHELL`.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"command":{"category":"","description":"Command and arguments to be executed, defaulting to `$SHELL`","labels":["command","args"],"shortName":"c"},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"ignore-environment":{"arity":0,"category":"","description":"Clear the entire environment (except those specified with `--keep`).","shortName":"i"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"keep":{"arity":1,"category":"","description":"Keep the environment variable *name*.","labels":["name"],"shortName":"k"},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"unset":{"arity":1,"category":"","description":"Unset the environment variable *name*.","labels":["name"],"shortName":"u"},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"show-config":{"args":[],"category":{"description":"Utility/scripting commands","id":101},"description":"show the Nix configuration","flags":{"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."}}},"show-derivation":{"args":[{"label":"installables","optional":false}],"category":{"description":"Utility/scripting commands","id":101},"description":"show the contents of a store derivation","doc":"\n\n# Examples\n\n* Show the store derivation that results from evaluating the Hello\n  package:\n\n  ```console\n  # nix show-derivation nixpkgs#hello\n  {\n    \"/nix/store/s6rn4jz1sin56rf4qj5b5v8jxjm32hlk-hello-2.10.drv\": {\n      …\n    }\n  }\n  ```\n\n* Show the full derivation graph (if available) that produced your\n  NixOS system:\n\n  ```console\n  # nix show-derivation -r /run/current-system\n  ```\n\n* Print all files fetched using `fetchurl` by Firefox's dependency\n  graph:\n\n  ```console\n  # nix show-derivation -r nixpkgs#firefox \\\n    | jq -r '.[] | select(.outputs.out.hash and .env.urls) | .env.urls' \\\n    | uniq | sort\n  ```\n\n  Note that `.outputs.out.hash` selects *fixed-output derivations*\n  (derivations that produce output with a specified content hash),\n  while `.env.urls` selects derivations with a `urls` attribute.\n\n# Description\n\nThis command prints on standard output a JSON representation of the\nstore derivations to which *installables* evaluate. Store derivations\nare used internally by Nix. They are store paths with extension `.drv`\nthat represent the build-time dependency graph to which a Nix\nexpression evaluates.\n\nBy default, this command only shows top-level derivations, but with\n`--recursive`, it also shows their dependencies.\n\nThe JSON output is a JSON object whose keys are the store paths of the\nderivations, and whose values are a JSON object with the following\nfields:\n\n* `outputs`: Information about the output paths of the\n  derivation. This is a JSON object with one member per output, where\n  the key is the output name and the value is a JSON object with these\n  fields:\n\n  * `path`: The output path.\n  * `hashAlgo`: For fixed-output derivations, the hashing algorithm\n    (e.g. `sha256`), optionally prefixed by `r:` if `hash` denotes a\n    NAR hash rather than a flat file hash.\n  * `hash`: For fixed-output derivations, the expected content hash in\n    base-16.\n\n  Example:\n\n  ```json\n  \"outputs\": {\n    \"out\": {\n      \"path\": \"/nix/store/2543j7c6jn75blc3drf4g5vhb1rhdq29-source\",\n      \"hashAlgo\": \"r:sha256\",\n      \"hash\": \"6fc80dcc62179dbc12fc0b5881275898f93444833d21b89dfe5f7fbcbb1d0d62\"\n    }\n  }\n  ```\n\n* `inputSrcs`: A list of store paths on which this derivation depends.\n\n* `inputDrvs`: A JSON object specifying the derivations on which this\n  derivation depends, and what outputs of those derivations. For\n  example,\n\n  ```json\n  \"inputDrvs\": {\n    \"/nix/store/6lkh5yi7nlb7l6dr8fljlli5zfd9hq58-curl-7.73.0.drv\": [\"dev\"],\n    \"/nix/store/fn3kgnfzl5dzym26j8g907gq3kbm8bfh-unzip-6.0.drv\": [\"out\"]\n  }\n  ```\n\n  specifies that this derivation depends on the `dev` output of\n  `curl`, and the `out` output of `unzip`.\n\n* `system`: The system type on which this derivation is to be built\n  (e.g. `x86_64-linux`).\n\n* `builder`: The absolute path of the program to be executed to run\n  the build. Typically this is the `bash` shell\n  (e.g. `/nix/store/r3j288vpmczbl500w6zz89gyfa4nr0b1-bash-4.4-p23/bin/bash`).\n\n* `args`: The command-line arguments passed to the `builder`.\n\n* `env`: The environment passed to the `builder`.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"recursive":{"arity":0,"category":"","description":"Include the dependencies of the specified derivations.","shortName":"r"},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"store":{"args":[{"arity":1,"label":"subcommand","optional":true}],"category":{"description":"Utility/scripting commands","id":101},"commands":{"add-file":{"args":[{"arity":1,"label":"path","optional":false}],"category":{"description":"Available commands","id":0},"description":"add a regular file to the Nix store","doc":"\n\n# Description\n\nCopy the regular file *path* to the Nix store, and print the resulting\nstore path on standard output.\n\n> **Warning**\n>\n> The resulting store path is not registered as a garbage\n> collector root, so it could be deleted before you have a\n> chance to register it.\n\n# Examples\n\nAdd a regular file to the store:\n\n```console\n# echo foo > bar\n\n# nix store add-file ./bar\n/nix/store/cbv2s4bsvzjri77s2gb8g8bpcb6dpa8w-bar\n\n# cat /nix/store/cbv2s4bsvzjri77s2gb8g8bpcb6dpa8w-bar\nfoo\n```\n\n","flags":{"dry-run":{"arity":0,"category":"","description":"Show what this command would do without doing it."},"name":{"arity":1,"category":"","description":"Override the name component of the store path. It defaults to the base name of *path*.","labels":["name"],"shortName":"n"}}},"add-path":{"args":[{"arity":1,"label":"path","optional":false}],"category":{"description":"Available commands","id":0},"description":"add a path to the Nix store","doc":"\n\n# Description\n\nCopy *path* to the Nix store, and print the resulting store path on\nstandard output.\n\n> **Warning**\n>\n> The resulting store path is not registered as a garbage\n> collector root, so it could be deleted before you have a\n> chance to register it.\n\n# Examples\n\nAdd a directory to the store:\n\n```console\n# mkdir dir\n# echo foo > dir/bar\n\n# nix store add-path ./dir\n/nix/store/6pmjx56pm94n66n4qw1nff0y1crm8nqg-dir\n\n# cat /nix/store/6pmjx56pm94n66n4qw1nff0y1crm8nqg-dir/bar\nfoo\n```\n\n","flags":{"dry-run":{"arity":0,"category":"","description":"Show what this command would do without doing it."},"name":{"arity":1,"category":"","description":"Override the name component of the store path. It defaults to the base name of *path*.","labels":["name"],"shortName":"n"}}},"cat":{"args":[{"arity":1,"label":"path","optional":false}],"category":{"description":"Available commands","id":0},"description":"print the contents of a file in the Nix store on stdout","doc":"\n\n# Examples\n\n* Show the contents of a file in a binary cache:\n\n  ```console\n  # nix store cat --store https://cache.nixos.org/ \\\n      /nix/store/0i2jd68mp5g6h2sa5k9c85rb80sn8hi9-hello-2.10/bin/hello | hexdump -C | head -n1\n  00000000  7f 45 4c 46 02 01 01 00  00 00 00 00 00 00 00 00  |.ELF............|\n  ```\n\n# Description\n\nThis command prints on standard output the contents of the regular\nfile *path* in a Nix store. *path* can be a top-level store path or\nany file inside a store path.\n\n","flags":{}},"copy-log":{"args":[{"label":"installables","optional":false}],"category":{"description":"","id":101},"description":"copy build logs between Nix stores","doc":"\n\n# Examples\n\n* To copy the build log of the `hello` package from\n  https://cache.nixos.org to the local store:\n\n  ```console\n  # nix store copy-log --from https://cache.nixos.org --eval-store auto nixpkgs#hello\n  ```\n\n  You can verify that the log is available locally:\n\n  ```console\n  # nix log --substituters '' nixpkgs#hello\n  ```\n\n  (The flag `--substituters ''` avoids querying\n  `https://cache.nixos.org` for the log.)\n\n* To copy the log for a specific store derivation via SSH:\n\n  ```console\n  # nix store copy-log --to ssh-ng://machine /nix/store/ilgm50plpmcgjhcp33z6n4qbnpqfhxym-glibc-2.33-59.drv\n  ```\n\n# Description\n\n`nix store copy-log` copies build logs between two Nix stores. The\nsource store is specified using `--from` and the destination using\n`--to`. If one of these is omitted, it defaults to the local store.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that chan