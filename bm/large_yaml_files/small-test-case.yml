{"args":[{"arity":1,"label":"subcommand","optional":true}],"commands":{"build":{"args":[{"label":"installables","optional":false}],"category":{"description":"Main commands","id":0},"description":"build a derivation or fetch a store path","doc":"\n\n# Examples\n\n* Build the default package from the flake in the current directory:\n\n  ```console\n  # nix build\n  ```\n\n* Build and run GNU Hello from the `nixpkgs` flake:\n\n  ```console\n  # nix build nixpkgs#hello\n  # ./result/bin/hello\n  Hello, world!\n  ```\n\n* Build GNU Hello and Cowsay, leaving two result symlinks:\n\n  ```console\n  # nix build nixpkgs#hello nixpkgs#cowsay\n  # ls -l result*\n  lrwxrwxrwx 1 … result -> /nix/store/v5sv61sszx301i0x6xysaqzla09nksnd-hello-2.10\n  lrwxrwxrwx 1 … result-1 -> /nix/store/rkfrm0z6x6jmi7d3gsmma4j53h15mg33-cowsay-3.03+dfsg2\n  ```\n\n* Build GNU Hello and print the resulting store path.\n\n  ```console\n  # nix build nixpkgs#hello --print-out-paths\n  /nix/store/v5sv61sszx301i0x6xysaqzla09nksnd-hello-2.10\n  ```\n\n* Build a specific output:\n\n  ```console\n  # nix build nixpkgs#glibc.dev\n  # ls -ld ./result-dev\n  lrwxrwxrwx 1 … ./result-dev -> /nix/store/dkm3gwl0xrx0wrw6zi5x3px3lpgjhlw4-glibc-2.32-dev\n  ```\n\n* Build attribute `build.x86_64-linux` from (non-flake) Nix expression\n  `release.nix`:\n\n  ```console\n  # nix build -f release.nix build.x86_64-linux\n  ```\n\n* Build a NixOS system configuration from a flake, and make a profile\n  point to the result:\n\n  ```console\n  # nix build --profile /nix/var/nix/profiles/system \\\n      ~/my-configurations#nixosConfigurations.machine.config.system.build.toplevel\n  ```\n\n  (This is essentially what `nixos-rebuild` does.)\n\n* Build an expression specified on the command line:\n\n  ```console\n  # nix build --impure --expr \\\n      'with import <nixpkgs> {};\n       runCommand \"foo\" {\n         buildInputs = [ hello ];\n       }\n       \"hello > $out\"'\n  # cat ./result\n  Hello, world!\n  ```\n\n  Note that `--impure` is needed because we're using `<nixpkgs>`,\n  which relies on the `$NIX_PATH` environment variable.\n\n* Fetch a store path from the configured substituters, if it doesn't\n  already exist:\n\n  ```console\n  # nix build /nix/store/rkfrm0z6x6jmi7d3gsmma4j53h15mg33-cowsay-3.03+dfsg2\n  ```\n\n# Description\n\n`nix build` builds the specified *installables*. Installables that\nresolve to derivations are built (or substituted if possible). Store\npath installables are substituted.\n\nUnless `--no-link` is specified, after a successful build, it creates\nsymlinks to the store paths of the installables. These symlinks have\nthe prefix `./result` by default; this can be overridden using the\n`--out-link` option. Each symlink has a suffix `-<N>-<outname>`, where\n*N* is the index of the installable (with the left-most installable\nhaving index 0), and *outname* is the symbolic derivation output name\n(e.g. `bin`, `dev` or `lib`). `-<N>` is omitted if *N* = 0, and\n`-<outname>` is omitted if *outname* = `out` (denoting the default\noutput).\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"dry-run":{"arity":0,"category":"","description":"Show what this command would do without doing it."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"no-link":{"arity":0,"category":"","description":"Do not create symlinks to the build results."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"out-link":{"arity":1,"category":"","description":"Use *path* as prefix for the symlinks to the build results. It defaults to `result`.","labels":["path"],"shortName":"o"},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"print-out-paths":{"arity":0,"category":"","description":"Print the resulting output paths"},"profile":{"arity":1,"category":"","description":"The profile to operate on.","labels":["path"]},"rebuild":{"arity":0,"category":"","description":"Rebuild an already built package and compare the result to the existing store paths."},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"bundle":{"args":[{"arity":1,"label":"installable","optional":true}],"category":{"description":"Infrequently used commands","id":100},"description":"bundle an application so that it works outside of the Nix store","doc":"\n\n# Examples\n\n* Bundle Hello:\n\n  ```console\n  # nix bundle nixpkgs#hello\n  # ./hello\n  Hello, world!\n  ```\n\n* Bundle a specific version of Nix:\n\n  ```console\n  # nix bundle github:NixOS/nix/e3ddffb27e5fc37a209cfd843c6f7f6a9460a8ec\n  # ./nix --version\n  nix (Nix) 2.4pre20201215_e3ddffb\n  ```\n\n* Bundle a Hello using a specific bundler:\n\n  ```console\n  # nix bundle --bundler github:NixOS/bundlers#toDockerImage nixpkgs#hello\n  # docker load < hello-2.10.tar.gz\n  # docker run hello-2.10:latest hello\n  Hello, world!\n  ```\n\n# Description\n\n`nix bundle`, by default, packs the closure of the *installable* into a single\nself-extracting executable. See the [`bundlers`\nhomepage](https://github.com/NixOS/bundlers) for more details.\n\n> **Note**\n>\n> This command only works on Linux.\n\n# Flake output attributes\n\nIf no flake output attribute is given, `nix bundle` tries the following\nflake output attributes:\n\n* `bundlers.<system>.default`\n\nIf an attribute *name* is given, `nix bundle` tries the following flake\noutput attributes:\n\n* `bundlers.<system>.<name>`\n\n# Bundlers\n\nA bundler is specified by a flake output attribute named\n`bundlers.<system>.<name>`. It looks like this:\n\n```nix\nbundlers.x86_64-linux = rec {\n  identity = drv: drv;\n\n  blender_2_79 = drv: self.packages.x86_64-linux.blender_2_79;\n\n  default = identity;\n};\n```\n\nA bundler must be a function that accepts an arbitrary value (typically a\nderivation or app definition) and returns a derivation.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"bundler":{"arity":1,"category":"","description":"Use a custom bundler instead of the default (`github:NixOS/bundlers`).","labels":["flake-url"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"out-link":{"arity":1,"category":"","description":"Override the name of the symlink to the build result. It defaults to the base name of the app.","labels":["path"],"shortName":"o"},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"copy":{"args":[{"label":"installables","optional":false}],"category":{"description":"Infrequently used commands","id":100},"description":"copy paths between Nix stores","doc":"\n\n# Examples\n\n* Copy Firefox from the local store to a binary cache in `/tmp/cache`:\n\n  ```console\n  # nix copy --to file:///tmp/cache $(type -p firefox)\n  ```\n\n  Note the `file://` - without this, the destination is a chroot\n  store, not a binary cache.\n\n* Copy the entire current NixOS system closure to another machine via\n  SSH:\n\n  ```console\n  # nix copy -s --to ssh://server /run/current-system\n  ```\n\n  The `-s` flag causes the remote machine to try to substitute missing\n  store paths, which may be faster if the link between the local and\n  remote machines is slower than the link between the remote machine\n  and its substituters (e.g. `https://cache.nixos.org`).\n\n* Copy a closure from another machine via SSH:\n\n  ```console\n  # nix copy --from ssh://server /nix/store/a6cnl93nk1wxnq84brbbwr6hxw9gp2w9-blender-2.79-rc2\n  ```\n\n* Copy Hello to a binary cache in an Amazon S3 bucket:\n\n  ```console\n  # nix copy --to s3://my-bucket?region=eu-west-1 nixpkgs#hello\n  ```\n\n  or to an S3-compatible storage system:\n\n  ```console\n  # nix copy --to s3://my-bucket?region=eu-west-1&endpoint=example.com nixpkgs#hello\n  ```\n\n  Note that this only works if Nix is built with AWS support.\n\n* Copy a closure from `/nix/store` to the chroot store `/tmp/nix/nix/store`:\n\n  ```console\n  # nix copy --to /tmp/nix nixpkgs#hello --no-check-sigs\n  ```\n\n# Description\n\n`nix copy` copies store path closures between two Nix stores. The\nsource store is specified using `--from` and the destination using\n`--to`. If one of these is omitted, it defaults to the local store.\n\n","flags":{"all":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply the operation to every store path."},"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"from":{"arity":1,"category":"","description":"URL of the source Nix store.","labels":["store-uri"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-check-sigs":{"arity":0,"category":"","description":"Do not require that paths are signed by trusted keys."},"no-recursive":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply operation to specified paths only."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"substitute-on-destination":{"arity":0,"category":"","description":"Whether to try substitutes on the destination store (only supported by SSH stores).","shortName":"s"},"to":{"arity":1,"category":"","description":"URL of the destination Nix store.","labels":["store-uri"]},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"daemon":{"args":[],"category":{"description":"Utility/scripting commands","id":101},"description":"daemon to perform store operations on behalf of non-root clients","doc":"\n\n# Example\n\n* Run the daemon in the foreground:\n\n  ```console\n  # nix daemon\n  ```\n\n# Description\n\nThis command runs the Nix daemon, which is a required component in\nmulti-user Nix installations. It performs build actions and other\noperations on the Nix store on behalf of non-root users. Usually you\ndon't run the daemon directly; instead it's managed by a service\nmanagement framework such as `systemd`.\n\nNote that this daemon does not fork into the background.\n\n","flags":{}},"describe-stores":{"args":[],"category":{"description":"Utility/scripting commands","id":101},"description":"show registered store types and their available options","flags":{"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."}}},"develop":{"args":[{"arity":1,"label":"installable","optional":true}],"category":{"description":"Main commands","id":0},"description":"run a bash shell that provides the build environment of a derivation","doc":"\n\n# Examples\n\n* Start a shell with the build environment of the default package of\n  the flake in the current directory:\n\n  ```console\n  # nix develop\n  ```\n\n  Typical commands to run inside this shell are:\n\n  ```console\n  # configurePhase\n  # buildPhase\n  # installPhase\n  ```\n\n  Alternatively, you can run whatever build tools your project uses\n  directly, e.g. for a typical Unix project:\n\n  ```console\n  # ./configure --prefix=$out\n  # make\n  # make install\n  ```\n\n* Run a particular build phase directly:\n\n  ```console\n  # nix develop --unpack\n  # nix develop --configure\n  # nix develop --build\n  # nix develop --check\n  # nix develop --install\n  # nix develop --installcheck\n  ```\n\n* Start a shell with the build environment of GNU Hello:\n\n  ```console\n  # nix develop nixpkgs#hello\n  ```\n\n* Record a build environment in a profile:\n\n  ```console\n  # nix develop --profile /tmp/my-build-env nixpkgs#hello\n  ```\n\n* Use a build environment previously recorded in a profile:\n\n  ```console\n  # nix develop /tmp/my-build-env\n  ```\n\n* Replace all occurrences of the store path corresponding to\n  `glibc.dev` with a writable directory:\n\n  ```console\n  # nix develop --redirect nixpkgs#glibc.dev ~/my-glibc/outputs/dev\n  ```\n\n  Note that this is useful if you're running a `nix develop` shell for\n  `nixpkgs#glibc` in `~/my-glibc` and want to compile another package\n  against it.\n\n* Run a series of script commands:\n\n  ```console\n  # nix develop --command bash -c \"mkdir build && cmake .. && make\"\n  ```\n\n# Description\n\n`nix develop` starts a `bash` shell that provides an interactive build\nenvironment nearly identical to what Nix would use to build\n*installable*. Inside this shell, environment variables and shell\nfunctions are set up so that you can interactively and incrementally\nbuild your package.\n\nNix determines the build environment by building a modified version of\nthe derivation *installable* that just records the environment\ninitialised by `stdenv` and exits. This build environment can be\nrecorded into a profile using `--profile`.\n\nThe prompt used by the `bash` shell can be customised by setting the\n`bash-prompt`, `bash-prompt-prefix`, and `bash-prompt-suffix` settings in\n`nix.conf` or in the flake's `nixConfig` attribute.\n\n# Flake output attributes\n\nIf no flake output attribute is given, `nix develop` tries the following\nflake output attributes:\n\n* `devShells.<system>.default`\n\n* `packages.<system>.default`\n\nIf a flake output *name* is given, `nix develop` tries the following flake\noutput attributes:\n\n* `devShells.<system>.<name>`\n\n* `packages.<system>.<name>`\n\n* `legacyPackages.<system>.<name>`\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"build":{"arity":0,"category":"","description":"Run the `build` phase."},"check":{"arity":0,"category":"","description":"Run the `check` phase."},"command":{"category":"","description":"Instead of starting an interactive shell, start the specified command and arguments.","labels":["command","args"],"shortName":"c"},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"configure":{"arity":0,"category":"","description":"Run the `configure` phase."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"ignore-environment":{"arity":0,"category":"","description":"Clear the entire environment (except those specified with `--keep`).","shortName":"i"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"install":{"arity":0,"category":"","description":"Run the `install` phase."},"installcheck":{"arity":0,"category":"","description":"Run the `installcheck` phase."},"keep":{"arity":1,"category":"","description":"Keep the environment variable *name*.","labels":["name"],"shortName":"k"},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"phase":{"arity":1,"category":"","description":"The stdenv phase to run (e.g. `build` or `configure`).","labels":["phase-name"]},"profile":{"arity":1,"category":"","description":"The profile to operate on.","labels":["path"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"redirect":{"arity":2,"category":"","description":"Redirect a store path to a mutable location.","labels":["installable","outputs-dir"]},"unpack":{"arity":0,"category":"","description":"Run the `unpack` phase."},"unset":{"arity":1,"category":"","description":"Unset the environment variable *name*.","labels":["name"],"shortName":"u"},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"doctor":{"args":[],"category":{"description":"Commands for upgrading or troubleshooting your Nix installation","id":102},"description":"check your system for potential problems and print a PASS or FAIL for each check","flags":{}},"edit":{"args":[{"arity":1,"label":"installable","optional":true}],"category":{"description":"Infrequently used commands","id":100},"description":"open the Nix expression of a Nix package in $EDITOR","doc":"\n\n# Examples\n\n* Open the Nix expression of the GNU Hello package:\n\n  ```console\n  # nix edit nixpkgs#hello\n  ```\n\n* Get the filename and line number used by `nix edit`:\n\n  ```console\n  # nix eval --raw nixpkgs#hello.meta.position\n  /nix/store/fvafw0gvwayzdan642wrv84pzm5bgpmy-source/pkgs/applications/misc/hello/default.nix:15\n  ```\n\n# Description\n\nThis command opens the Nix expression of a derivation in an\neditor. The filename and line number of the derivation are taken from\nits `meta.position` attribute. Nixpkgs' `stdenv.mkDerivation` sets\nthis attribute to the location of the definition of the\n`meta.description`, `version` or `name` derivation attributes.\n\nThe editor to invoke is specified by the `EDITOR` environment\nvariable. It defaults to `cat`. If the editor is `emacs`, `nano`,\n`vim` or `kak`, it is passed the line number of the derivation using\nthe argument `+<lineno>`.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"eval":{"args":[{"arity":1,"label":"installable","optional":true}],"category":{"description":"Infrequently used commands","id":100},"description":"evaluate a Nix expression","doc":"\n\n# Examples\n\n* Evaluate a Nix expression given on the command line:\n\n  ```console\n  # nix eval --expr '1 + 2'\n  ```\n\n* Evaluate a Nix expression to JSON:\n\n  ```console\n  # nix eval --json --expr '{ x = 1; }'\n  {\"x\":1}\n  ```\n\n* Evaluate a Nix expression from a file:\n\n  ```console\n  # nix eval -f ./my-nixpkgs hello.name\n  ```\n\n* Get the current version of the `nixpkgs` flake:\n\n  ```console\n  # nix eval --raw nixpkgs#lib.version\n  ```\n\n* Print the store path of the Hello package:\n\n  ```console\n  # nix eval --raw nixpkgs#hello\n  ```\n\n* Get a list of checks in the `nix` flake:\n\n  ```console\n  # nix eval nix#checks.x86_64-linux --apply builtins.attrNames\n  ```\n\n* Generate a directory with the specified contents:\n\n  ```console\n  # nix eval --write-to ./out --expr '{ foo = \"bar\"; subdir.bla = \"123\"; }'\n  # cat ./out/foo\n  bar\n  # cat ./out/subdir/bla\n  123\n\n# Description\n\nThis command evaluates the Nix expression *installable* and prints the\nresult on standard output.\n\n# Output format\n\n`nix eval` can produce output in several formats:\n\n* By default, the evaluation result is printed as a Nix expression.\n\n* With `--json`, the evaluation result is printed in JSON format. Note\n  that this fails if the result contains values that are not\n  representable as JSON, such as functions.\n\n* With `--raw`, the evaluation result must be a string, which is\n  printed verbatim, without any quoting.\n\n* With `--write-to` *path*, the evaluation result must be a string or\n  a nested attribute set whose leaf values are strings. These strings\n  are written to files named *path*/*attrpath*. *path* must not\n  already exist.\n\n","flags":{"apply":{"arity":1,"category":"","description":"Apply the function *expr* to each argument.","labels":["expr"]},"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"raw":{"arity":0,"category":"","description":"Print strings without quotes or escaping."},"read-only":{"arity":0,"category":"","description":"Do not instantiate each evaluated derivation. This improves performance, but can cause errors when accessing store paths of derivations during evaluation."},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]},"write-to":{"arity":1,"category":"","description":"Write a string or attrset of strings to *path*.","labels":["path"]}}},"flake":{"args":[{"arity":1,"label":"subcommand","optional":true}],"category":{"description":"Main commands","id":0},"commands":{"archive":{"args":[{"arity":1,"label":"flake-url","optional":true}],"category":{"description":"Available commands","id":0},"description":"copy a flake and all its inputs to a store","doc":"\n\n# Examples\n\n* Copy the `dwarffs` flake and its dependencies to a binary cache:\n\n  ```console\n  # nix flake archive --to file:///tmp/my-cache dwarffs\n  ```\n\n* Fetch the `dwarffs` flake and its dependencies to the local Nix\n  store:\n\n  ```console\n  # nix flake archive dwarffs\n  ```\n\n* Print the store paths of the flake sources of NixOps without\n  fetching them:\n\n  ```console\n  # nix flake archive --json --dry-run nixops\n  ```\n\n# Description\n\nFIXME\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"dry-run":{"arity":0,"category":"","description":"Show what this command would do without doing it."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"to":{"arity":1,"category":"","description":"URI of the destination Nix store","labels":["store-uri"]},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"check":{"args":[{"arity":1,"label":"flake-url","optional":true}],"category":{"description":"Available commands","id":0},"description":"check whether the flake evaluates and run its tests","doc":"\n\n# Examples\n\n* Evaluate the flake in the current directory, and build its checks:\n\n  ```console\n  # nix flake check\n  ```\n\n* Verify that the `patchelf` flake evaluates, but don't build its\n  checks:\n\n  ```console\n  # nix flake check --no-build github:NixOS/patchelf\n  ```\n\n# Description\n\nThis command verifies that the flake specified by flake reference\n*flake-url* can be evaluated successfully (as detailed below), and\nthat the derivations specified by the flake's `checks` output can be\nbuilt successfully.\n\nIf the `keep-going` option is set to `true`, Nix will keep evaluating as much\nas it can and report the errors as it encounters them. Otherwise it will stop\nat the first error.\n\n# Evaluation checks\n\nThe following flake output attributes must be derivations:\n\n* `checks.`*system*`.`*name*\n* `defaultPackage.`*system*\n* `devShell.`*system*\n* `devShells.`*system*`.`*name*\n* `nixosConfigurations.`*name*`.config.system.build.toplevel`\n* `packages.`*system*`.`*name*\n\nThe following flake output attributes must be [app\ndefinitions](./nix3-run.md):\n\n* `apps.`*system*`.`*name*\n* `defaultApp.`*system*\n\nThe following flake output attributes must be [template\ndefinitions](./nix3-flake-init.md):\n\n* `defaultTemplate`\n* `templates.`*name*\n\nThe following flake output attributes must be *Nixpkgs overlays*:\n\n* `overlay`\n* `overlays.`*name*\n\nThe following flake output attributes must be *NixOS modules*:\n\n* `nixosModule`\n* `nixosModules.`*name*\n\nThe following flake output attributes must be\n[bundlers](./nix3-bundle.md):\n\n* `bundlers.`*name*\n* `defaultBundler`\n\nIn addition, the `hydraJobs` output is evaluated in the same way as\nHydra's `hydra-eval-jobs` (i.e. as a arbitrarily deeply nested\nattribute set of derivations). Similarly, the\n`legacyPackages`.*system* output is evaluated like `nix-env -qa`.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-build":{"arity":0,"category":"","description":"Do not build checks."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"clone":{"args":[{"arity":1,"label":"flake-url","optional":true}],"category":{"description":"Available commands","id":0},"description":"clone flake repository","doc":"\n\n# Examples\n\n* Check out the source code of the `dwarffs` flake and build it:\n\n  ```console\n  # nix flake clone dwarffs --dest dwarffs\n  # cd dwarffs\n  # nix build\n  ```\n\n# Description\n\nThis command performs a Git or Mercurial clone of the repository\ncontaining the source code of the flake *flake-url*.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"dest":{"arity":1,"category":"","description":"Clone the flake to path *dest*.","labels":["path"],"shortName":"f"},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"info":{"args":[{"arity":1,"label":"flake-url","optional":true}],"category":{"description":"Available commands","id":0},"description":"show flake metadata","doc":"\n\n# Examples\n\n* Show what `nixpkgs` resolves to:\n\n  ```console\n  # nix flake metadata nixpkgs\n  Resolved URL:  github:edolstra/dwarffs\n  Locked URL:    github:edolstra/dwarffs/f691e2c991e75edb22836f1dbe632c40324215c5\n  Description:   A filesystem that fetches DWARF debug info from the Internet on demand\n  Path:          /nix/store/769s05vjydmc2lcf6b02az28wsa9ixh1-source\n  Revision:      f691e2c991e75edb22836f1dbe632c40324215c5\n  Last modified: 2021-01-21 15:41:26\n  Inputs:\n  ├───nix: github:NixOS/nix/6254b1f5d298ff73127d7b0f0da48f142bdc753c\n  │   ├───lowdown-src: github:kristapsdz/lowdown/1705b4a26fbf065d9574dce47a94e8c7c79e052f\n  │   └───nixpkgs: github:NixOS/nixpkgs/ad0d20345219790533ebe06571f82ed6b034db31\n  └───nixpkgs follows input 'nix/nixpkgs'\n  ```\n\n* Show information about `dwarffs` in JSON format:\n\n  ```console\n  # nix flake metadata dwarffs --json | jq .\n  {\n    \"description\": \"A filesystem that fetches DWARF debug info from the Internet on demand\",\n    \"lastModified\": 1597153508,\n    \"locked\": {\n      \"lastModified\": 1597153508,\n      \"narHash\": \"sha256-VHg3MYVgQ12LeRSU2PSoDeKlSPD8PYYEFxxwkVVDRd0=\",\n      \"owner\": \"edolstra\",\n      \"repo\": \"dwarffs\",\n      \"rev\": \"d181d714fd36eb06f4992a1997cd5601e26db8f5\",\n      \"type\": \"github\"\n    },\n    \"locks\": { ... },\n    \"original\": {\n      \"id\": \"dwarffs\",\n      \"type\": \"indirect\"\n    },\n    \"originalUrl\": \"flake:dwarffs\",\n    \"path\": \"/nix/store/hang3792qwdmm2n0d9nsrs5n6bsws6kv-source\",\n    \"resolved\": {\n      \"owner\": \"edolstra\",\n      \"repo\": \"dwarffs\",\n      \"type\": \"github\"\n    },\n    \"resolvedUrl\": \"github:edolstra/dwarffs\",\n    \"revision\": \"d181d714fd36eb06f4992a1997cd5601e26db8f5\",\n    \"url\": \"github:edolstra/dwarffs/d181d714fd36eb06f4992a1997cd5601e26db8f5\"\n  }\n  ```\n\n# Description\n\nThis command shows information about the flake specified by the flake\nreference *flake-url*. It resolves the flake reference using the\n[flake registry](./nix3-registry.md), fetches it, and prints some meta\ndata. This includes:\n\n* `Resolved URL`: If *flake-url* is a flake identifier, then this is\n  the flake reference that specifies its actual location, looked up in\n  the flake registry.\n\n* `Locked URL`: A flake reference that contains a commit or content\n  hash and thus uniquely identifies a specific flake version.\n\n* `Description`: A one-line description of the flake, taken from the\n  `description` field in `flake.nix`.\n\n* `Path`: The store path containing the source code of the flake.\n\n* `Revision`: The Git or Mercurial commit hash of the locked flake.\n\n* `Revisions`: The number of ancestors of the Git or Mercurial commit\n  of the locked flake. Note that this is not available for `github`\n  flakes.\n\n* `Last modified`: For Git or Mercurial flakes, this is the commit\n  time of the commit of the locked flake; for tarball flakes, it's the\n  most recent timestamp of any file inside the tarball.\n\n* `Inputs`: The flake inputs with their corresponding lock file\n  entries.\n\nWith `--json`, the output is a JSON object with the following fields:\n\n* `original` and `originalUrl`: The flake reference specified by the\n  user (*flake-url*) in attribute set and URL representation.\n\n* `resolved` and `resolvedUrl`: The resolved flake reference (see\n  above) in attribute set and URL representation.\n\n* `locked` and `lockedUrl`: The locked flake reference (see above) in\n  attribute set and URL representation.\n\n* `description`: See `Description` above.\n\n* `path`: See `Path` above.\n\n* `revision`: See `Revision` above.\n\n* `revCount`: See `Revisions` above.\n\n* `lastModified`: See `Last modified` above.\n\n* `locks`: The contents of `flake.lock`.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"init":{"args":[],"category":{"description":"Available commands","id":0},"description":"create a flake in the current directory from a template","doc":"\n\n# Examples\n\n* Create a flake using the default template:\n\n  ```console\n  # nix flake init\n  ```\n\n* List available templates:\n\n  ```console\n  # nix flake show templates\n  ```\n\n* Create a flake from a specific template:\n\n  ```console\n  # nix flake init -t templates#simpleContainer\n  ```\n\n# Description\n\nThis command creates a flake in the current directory by copying the\nfiles of a template. It will not overwrite existing files. The default\ntemplate is `templates#templates.default`, but this can be overridden\nusing `-t`.\n\n# Template definitions\n\nA flake can declare templates through its `templates` output\nattribute. A template has two attributes:\n\n* `description`: A one-line description of the template, in CommonMark\n  syntax.\n\n* `path`: The path of the directory to be copied.\n\n* `welcomeText`: A block of markdown text to display when a user initializes a\n  new flake based on this template.\n\n\nHere is an example:\n\n```\noutputs = { self }: {\n\n  templates.rust = {\n    path = ./rust;\n    description = \"A simple Rust/Cargo project\";\n    welcomeText = ''\n      # Simple Rust/Cargo Template\n      ## Intended usage\n      The intended usage of this flake is...\n\n      ## More info\n      - [Rust language](https://www.rust-lang.org/)\n      - [Rust on the NixOS Wiki](https://nixos.wiki/wiki/Rust)\n      - ...\n    '';\n  };\n\n  templates.default = self.templates.rust;\n}\n```\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"template":{"arity":1,"category":"","description":"The template to use.","labels":["template"],"shortName":"t"}}},"lock":{"args":[{"arity":1,"label":"flake-url","optional":true}],"category":{"description":"Available commands","id":0},"description":"create missing lock file entries","doc":"\n\n# Examples\n\n* Update the `nixpkgs` and `nix` inputs of the flake in the current\n  directory:\n\n  ```console\n  # nix flake lock --update-input nixpkgs --update-input nix\n  * Updated 'nix': 'github:NixOS/nix/9fab14adbc3810d5cc1f88672fde1eee4358405c' -> 'github:NixOS/nix/8927cba62f5afb33b01016d5c4f7f8b7d0adde3c'\n  * Updated 'nixpkgs': 'github:NixOS/nixpkgs/3d2d8f281a27d466fa54b469b5993f7dde198375' -> 'github:NixOS/nixpkgs/a3a3dda3bacf61e8a39258a0ed9c924eeca8e293'\n  ```\n\n# Description\n\nThis command updates the lock file of a flake (`flake.lock`) so that\nit contains a lock for every flake input specified in\n`flake.nix`. Existing lock file entries are not updated unless\nrequired by a flag such as `--update-input`.\n\nNote that every command that operates on a flake will also update the\nlock file if needed, and supports the same flags. Therefore,\n\n```console\n# nix flake lock --update-input nixpkgs\n# nix build\n```\n\nis equivalent to:\n\n```console\n# nix build --update-input nixpkgs\n```\n\nThus, this command is only useful if you want to update the lock file\nseparately from any other action such as building.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"metadata":{"args":[{"arity":1,"label":"flake-url","optional":true}],"category":{"description":"Available commands","id":0},"description":"show flake metadata","doc":"\n\n# Examples\n\n* Show what `nixpkgs` resolves to:\n\n  ```console\n  # nix flake metadata nixpkgs\n  Resolved URL:  github:edolstra/dwarffs\n  Locked URL:    github:edolstra/dwarffs/f691e2c991e75edb22836f1dbe632c40324215c5\n  Description:   A filesystem that fetches DWARF debug info from the Internet on demand\n  Path:          /nix/store/769s05vjydmc2lcf6b02az28wsa9ixh1-source\n  Revision:      f691e2c991e75edb22836f1dbe632c40324215c5\n  Last modified: 2021-01-21 15:41:26\n  Inputs:\n  ├───nix: github:NixOS/nix/6254b1f5d298ff73127d7b0f0da48f142bdc753c\n  │   ├───lowdown-src: github:kristapsdz/lowdown/1705b4a26fbf065d9574dce47a94e8c7c79e052f\n  │   └───nixpkgs: github:NixOS/nixpkgs/ad0d20345219790533ebe06571f82ed6b034db31\n  └───nixpkgs follows input 'nix/nixpkgs'\n  ```\n\n* Show information about `dwarffs` in JSON format:\n\n  ```console\n  # nix flake metadata dwarffs --json | jq .\n  {\n    \"description\": \"A filesystem that fetches DWARF debug info from the Internet on demand\",\n    \"lastModified\": 1597153508,\n    \"locked\": {\n      \"lastModified\": 1597153508,\n    