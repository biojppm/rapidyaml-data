tions","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"recursive":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply operation to closure of the specified paths.","shortName":"r"},"substituter":{"arity":1,"category":"","description":"Copy signatures from the specified store.","labels":["store-uri"],"shortName":"s"},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"delete":{"args":[{"label":"installables","optional":false}],"category":{"description":"Available commands","id":0},"description":"delete paths from the Nix store","doc":"\n\n# Examples\n\n* Delete a specific store path:\n\n  ```console\n  # nix store delete /nix/store/yb5q57zxv6hgqql42d5r8b5k5mcq6kay-hello-2.10\n  ```\n\n# Description\n\nThis command deletes the store paths specified by *installables*. ,\nbut only if it is safe to do so; that is, when the path is not\nreachable from a root of the garbage collector. This means that you\ncan only delete paths that would also be deleted by `nix store\ngc`. Thus, `nix store delete` is a more targeted version of `nix store\ngc`.\n\nWith the option `--ignore-liveness`, reachability from the roots is\nignored. However, the path still won't be deleted if there are other\npaths in the store that refer to it (i.e., depend on it).\n\n","flags":{"all":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply the operation to every store path."},"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"ignore-liveness":{"arity":0,"category":"","description":"Do not check whether the paths are reachable from a root."},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"recursive":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply operation to closure of the specified paths.","shortName":"r"},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"diff-closures":{"args":[{"arity":1,"label":"before","optional":false},{"arity":1,"label":"after","optional":false}],"category":{"description":"Available commands","id":0},"description":"show what packages and versions were added and removed between two closures","doc":"\n\n# Examples\n\n* Show what got added and removed between two versions of the NixOS\n  system profile:\n\n  ```console\n  # nix store diff-closures /nix/var/nix/profiles/system-655-link /nix/var/nix/profiles/system-658-link\n  acpi-call: 2020-04-07-5.8.16 → 2020-04-07-5.8.18\n  baloo-widgets: 20.08.1 → 20.08.2\n  bluez-qt: +12.6 KiB\n  dolphin: 20.08.1 → 20.08.2, +13.9 KiB\n  kdeconnect: 20.08.2 → ∅, -6597.8 KiB\n  kdeconnect-kde: ∅ → 20.08.2, +6599.7 KiB\n  …\n  ```\n\n# Description\n\nThis command shows the differences between the two closures *before*\nand *after* with respect to the addition, removal, or version change\nof packages, as well as changes in store path sizes.\n\nFor each package name in the two closures (where a package name is\ndefined as the name component of a store path excluding the version),\nif there is a change in the set of versions of the package, or a\nchange in the size of the store paths of more than 8 KiB, it prints a\nline like this:\n\n```console\ndolphin: 20.08.1 → 20.08.2, +13.9 KiB\n```\n\nNo size change is shown if it's below the threshold. If the package\ndoes not exist in either the *before* or *after* closures, it is\nrepresented using `∅` (empty set) on the appropriate side of the\narrow. If a package has an empty version string, the version is\nrendered as `ε` (epsilon).\n\nThere may be multiple versions of a package in each closure. In that\ncase, only the changed versions are shown. Thus,\n\n```console\nlibfoo: 1.2, 1.3 → 1.4\n```\n\nleaves open the possibility that there are other versions (e.g. `1.1`)\nthat exist in both closures.\n\n","flags":{"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file name