command generates a NAR file containing the serialisation of the\nstore path *installable*. The NAR is written to standard output.\n\n","flags":{"all":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply the operation to every store path."},"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"recursive":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply operation to closure of the specified paths.","shortName":"r"},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"gc":{"args":[],"category":{"description":"Available commands","id":0},"description":"perform garbage collection on a Nix store","doc":"\n\n# Examples\n\n* Delete unreachable paths in the Nix store:\n\n  ```console\n  # nix store gc\n  ```\n\n* Delete up to 1 gigabyte of garbage:\n\n  ```console\n  # nix store gc --max 1G\n  ```\n\n# Description\n\nThis command deletes unreachable paths in the Nix store.\n\n","flags":{"dry-run":{"arity":0,"category":"","description":"Show what this command would do without doing it."},"max":{"arity":1,"category":"","description":"Stop after freeing *n* bytes of disk space.","labels":["n"]}}},"ls":{"args":[{"arity":1,"label":"path","optional":false}],"category":{"description":"Available commands","id":0},"description":"show information about a path in the Nix store","doc":"\n\n# Examples\n\n* To list the contents of a store path in a binary cache:\n\n  ```console\n  # nix store ls --store https://cache.nixos.org/ -lR /nix/store/0i2jd68mp5g6h2sa5k9c85rb80sn8hi9-hello-2.10\n  dr-xr-xr-x                    0 ./bin\n  -r-xr-xr-x                38184 ./bin/hello\n  dr-xr-xr-x                    0 ./share\n  …\n  ```\n\n* To show information about a specific file in a binary cache:\n\n  ```console\n  # nix store ls --store https://cache.nixos.org/ -l /nix/store/0i2jd68mp5g6h2sa5k9c85rb80sn8hi9-hello-2.10/bin/hello\n  -r-xr-xr-x                38184 hello\n  ```\n\n# Description\n\nThis command shows information about *path* in a Nix store. *path* can\nbe a top-level store path or any file inside a store path.\n\n","flags":{"directory":{"arity":0,"category":"","description":"Show directories rather than their contents.","shortName":"d"},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"long":{"arity":0,"category":"","description":"Show detailed file information.","shortName":"l"},"recursive":{"arity":0,"category":"","description":"List subdirectories recursively.","shortName":"R"}}},"make-content-addressed":{"args":[{"label":"installables","optional":false}],"category":{"description":"Available commands","id":0},"description":"rewrite a path or closure to content-addressed form","doc":"\n\n# Examples\n\n* Create a content-addressed representation of the closure of GNU Hello:\n\n  ```console\n  # nix store make-content-addressed nixpkgs#hello\n  …\n  rewrote '/nix/store/v5sv61sszx301i0x6xysaqzla09nksnd-hello-2.10' to '/nix/store/5skmmcb9svys5lj3kbsrjg7vf2irid63-hello-2.10'\n  ```\n\n  Since the resulting paths are content-addressed, they are always\n  trusted and don't need signatures to copied to another store:\n\n  ```console\n  # nix copy --to /tmp/nix --trusted-public-keys '' /nix/store/5skmmcb9svys5lj3kbsrjg7vf2irid63-hello-2.10\n  ```\n\n  By contrast, the original closure is input-addressed, so it does\n  need signatures to be trusted:\n\n  ```console\n  # nix copy --to /tmp/nix --trusted-public-keys '' nixpkgs#hello\n  cannot add path '/nix/store/zy9wbxwcygrwnh8n2w9qbbcr6zk87m26-libunistring-0.9.10' because it lacks a signature by a trusted key\n  ```\n\n* Create a content-addressed representation of the current NixOS\n  system closure:\n\n  ```console\n  # nix store make-content-addressed /run/current-system\n  ```\n\n# Description\n\nThis command converts the closure of the store paths specified by\n*installables* to content-addressed form. Nix store paths are usually\n*input-addressed*, meaning that the hash part of the store path is\ncomputed from the contents of the derivation (i.e., the build-time\ndependency graph). Input-addressed paths need to be signed by a\ntrusted key if you want to import them into a store, because we need\nto trust that the contents of the path were actually built by the\nderivation.\n\nBy contrast, in a *content-addressed* path, the hash part is computed\nfrom the contents of the path. This allows the contents of the path to\nbe verified without any additional information such as\nsignatures. This means that a command like\n\n```console\n# nix store build /nix/store/5skmmcb9svys5lj3kbsrjg7vf2irid63-hello-2.10 \\\n    --substituters https://my-cache.example.org\n```\n\nwill succeed even if the binary cache `https://my-cache.example.org`\ndoesn't present any signatures.\n\n","flags":{"all":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply the operation to every store path."},"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"from":{"arity":1,"category":"","description":"URL of the source Nix store.","labels":["store-uri"]},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"recursive":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply operation to closure of the specified paths.","shortName":"r"},"to":{"arity":1,"category":"","description":"URL of the destination Nix store.","labels":["store-uri"]},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"optimise":{"args":[],"category":{"description":"Available commands","id":0},"description":"replace identical files in the store by hard links","doc":"\n\n# Examples\n\n* Optimise the Nix store:\n\n  ```console\n  nix store optimise\n  ```\n\n# Description\n\nThis command deduplicates the Nix store: it scans the store for\nregular files with identical contents, and replaces them with hard\nlinks to a single instance.\n\nNote that you can also set `auto-optimise-store` to `true` in\n`nix.conf` to perform this optimisation incrementally whenever a new\npath is added to the Nix store. To make this efficient, Nix maintains\na content-addressed index of all the files in the Nix store in the\ndirectory `/nix/store/.links/`.\n\n","flags":{}},"path-from-hash-part":{"args":[{"arity":1,"label":"hash-part","optional":false}],"category":{"description":"Available commands","id":0},"description":"get a store path from its hash part","doc":"\n\n# Examples\n\n* Return the full store path with the given hash part:\n\n  ```console\n  # nix store path-from-hash-part --store https://cache.nixos.org/ 0i2jd68mp5g6h2sa5k9c85rb80sn8hi9\n  /nix/store/0i2jd68mp5g6h2sa5k9c85rb80sn8hi9-hello-2.10\n  ```\n\n# Description\n\nGiven the hash part of a store path (that is, the 32 characters\nfollowing `/nix/store/`), return the full store path. This is\nprimarily useful in the implementation of binary caches, where a\nrequest for a `.narinfo` file only supplies the hash part\n(e.g. `https://cache.nixos.org/0i2jd68mp5g6h2sa5k9c85rb80sn8hi9.narinfo`).\n\n","flags":{}},"ping":{"args":[],"category":{"description":"Available commands","id":0},"description":"test whether a store can be accessed","doc":"\n\n# Examples\n\n* Test whether connecting to a remote Nix store via SSH works:\n\n  ```console\n  # nix store ping --store ssh://mac1\n  ```\n\n* Test whether a URL is a valid binary cache:\n\n  ```console\n  # nix store ping --store https://cache.nixos.org\n  ```\n\n* Test whether the Nix daemon is up and running:\n\n  ```console\n  # nix store ping --store daemon\n  ```\n\n# Description\n\nThis command tests whether a particular Nix store (specified by the\nargument `--store` *url*) can be accessed. What this means is\ndependent on the type of the store. For instance, for an SSH store it\nmeans that Nix can connect to the specified machine.\n\nIf the command succeeds, Nix returns a exit code of 0 and does not\nprint any output.\n\n","flags":{}},"prefetch-file":{"args":[{"arity":1,"label":"url","optional":false}],"category":{"description":"Available commands","id":0},"description":"download a file into the Nix store","doc":"\n\n# Examples\n\n* Download a file to the Nix store:\n\n  ```console\n  # nix store prefetch-file https://releases.nixos.org/nix/nix-2.3.10/nix-2.3.10.tar.xz\n  Downloaded 'https://releases.nixos.org/nix/nix-2.3.10/nix-2.3.10.tar.xz' to\n  '/nix/store/vbdbi42hgnc4h7pyqzp6h2yf77kw93aw-source' (hash\n  'sha256-qKheVd5D0BervxMDbt+1hnTKE2aRWC8XCAwc0SeHt6s=').\n  ```\n\n* Download a file and get the SHA-512 hash:\n\n  ```console\n  # nix store prefetch-file --json --hash-type sha512 \\\n      https://releases.nixos.org/nix/nix-2.3.10/nix-2.3.10.tar.xz \\\n    | jq -r .hash\n  sha512-6XJxfym0TNH9knxeH4ZOvns6wElFy3uahunl2hJgovACCMEMXSy42s69zWVyGJALXTI+86tpDJGlIcAySEKBbA==\n  ```\n\n# Description\n\nThis command downloads the file *url* to the Nix store. It prints out\nthe resulting store path and the cryptographic hash of the contents of\nthe file.\n\nThe name component of the store path defaults to the last component of\n*url*, but this can be overridden using `--name`.\n\n","flags":{"executable":{"arity":0,"category":"","description":"Make the resulting file executable. Note that this causes the resulting hash to be a NAR hash rather than a flat file hash."},"expected-hash":{"arity":1,"category":"","description":"The expected hash of the file.","labels":["hash"]},"hash-type":{"arity":1,"category":"","description":"hash algorithm ('md5', 'sha1', 'sha256', or 'sha512')","labels":["hash-algo"]},"json":{"arity":0,"category":"","description":"Produce output in JSON format, suitable for consumption by another program."},"name":{"arity":1,"category":"","description":"Override the name component of the resulting store path. It defaults to the base name of *url*.","labels":["name"]}}},"repair":{"args":[{"label":"installables","optional":false}],"category":{"description":"Available commands","id":0},"description":"repair store paths","doc":"\n\n# Examples\n\n* Repair a store path, after determining that it is corrupt:\n\n  ```console\n  # nix store verify /nix/store/yb5q57zxv6hgqql42d5r8b5k5mcq6kay-hello-2.10\n  path '/nix/store/yb5q57zxv6hgqql42d5r8b5k5mcq6kay-hello-2.10' was\n  modified! expected hash\n  'sha256:1hd5vnh6xjk388gdk841vflicy8qv7qzj2hb7xlyh8lpb43j921l', got\n  'sha256:1a25lf78x5wi6pfkrxalf0n13kdaca0bqmjqnp7wfjza2qz5ssgl'\n\n  # nix store repair /nix/store/yb5q57zxv6hgqql42d5r8b5k5mcq6kay-hello-2.10\n  ```\n\n# Description\n\nThis command attempts to \"repair\" the store paths specified by\n*installables* by redownloading them using the available\nsubstituters. If no substitutes are available, then repair is not\npossible.\n\n> **Warning**\n>\n> During repair, there is a very small time window during which the old\n> path (if it exists) is moved out of the way and replaced with the new\n> path. If repair is interrupted in between, then the system may be left\n> in a broken state (e.g., if the path contains a critical system\n> component like the GNU C Library).\n\n","flags":{"all":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply the operation to every store path."},"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"recursive":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply operation to closure of the specified paths.","shortName":"r"},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"sign":{"args":[{"label":"installables","optional":false}],"category":{"description":"Available commands","id":0},"description":"sign store paths","flags":{"all":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply the operation to every store path."},"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"key-file":{"arity":1,"category":"","description":"File containing the secret signing key.","labels":["file"],"shortName":"k"},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"recursive":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply operation to closure of the specified paths.","shortName":"r"},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}},"verify":{"args":[{"label":"installables","optional":false}],"category":{"description":"Available commands","id":0},"description":"verify the integrity of store paths","doc":"\n\n# Examples\n\n* Verify the entire Nix store:\n\n  ```console\n  # nix store verify --all\n  ```\n\n* Check whether each path in the closure of Firefox has at least 2\n  signatures:\n\n  ```console\n  # nix store verify -r -n2 --no-contents $(type -p firefox)\n  ```\n\n* Verify a store path in the binary cache `https://cache.nixos.org/`:\n\n  ```console\n  # nix store verify --store https://cache.nixos.org/ \\\n      /nix/store/v5sv61sszx301i0x6xysaqzla09nksnd-hello-2.10\n  ```\n\n# Description\n\nThis command verifies the integrity of the store paths *installables*,\nor, if `--all` is given, the entire Nix store. For each path, it\nchecks that\n\n* its contents match the NAR hash recorded in the Nix database; and\n\n* it is *trusted*, that is, it is signed by at least one trusted\n  signing key, is content-addressed, or is built locally (\"ultimately\n  trusted\").\n\n# Exit status\n\nThe exit status of this command is the sum of the following values:\n\n* **1** if any path is corrupted (i.e. its contents don't match the\n  recorded NAR hash).\n\n* **2** if any path is untrusted.\n\n* **4** if any path couldn't be verified for any other reason (such as\n  an I/O error).\n\n","flags":{"all":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply the operation to every store path."},"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-contents":{"arity":0,"category":"","description":"Do not verify the contents of each store path."},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-trust":{"arity":0,"category":"","description":"Do not verify whether each store path is trusted."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"recursive":{"arity":0,"category":"Options that change the interpretation of installables","description":"Apply operation to closure of the specified paths.","shortName":"r"},"sigs-needed":{"arity":1,"category":"","description":"Require that each path is signed by at least *n* different keys.","labels":["n"],"shortName":"n"},"substituter":{"arity":1,"category":"","description":"Use signatures from the specified store.","labels":["store-uri"],"shortName":"s"},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}}},"description":"manipulate a Nix store","flags":{}},"upgrade-nix":{"args":[],"category":{"description":"Commands for upgrading or troubleshooting your Nix installation","id":102},"description":"upgrade Nix to the stable version declared in Nixpkgs","doc":"\n\n# Examples\n\n* Upgrade Nix to the stable version declared in Nixpkgs:\n\n  ```console\n  # nix upgrade-nix\n  ```\n\n* Upgrade Nix in a specific profile:\n\n  ```console\n  # nix upgrade-nix -p /nix/var/nix/profiles/per-user/alice/profile\n  ```\n\n# Description\n\nThis command upgrades Nix to the stable version declared in Nixpkgs.\nThis stable version is defined in [nix-fallback-paths.nix](https://github.com/NixOS/nixpkgs/raw/master/nixos/modules/installer/tools/nix-fallback-paths.nix)\nand updated manually. It may not always be the latest tagged release.\n\nBy default, it locates the directory containing the `nix` binary in the `$PATH`\nenvironment variable. If that directory is a Nix profile, it will\nupgrade the `nix` package in that profile to the latest stable binary\nrelease.\n\nYou cannot use this command to upgrade Nix in the system profile of a\nNixOS system (that is, if `nix` is found in `/run/current-system`).\n\n","flags":{"dry-run":{"arity":0,"category":"","description":"Show what this command would do without doing it."},"nix-store-paths-url":{"arity":1,"category":"","description":"The URL of the file that contains the store paths of the latest Nix release.","labels":["url"]},"profile":{"arity":1,"category":"","description":"The path to the Nix profile to upgrade.","labels":["profile-dir"],"shortName":"p"}}},"why-depends":{"args":[{"arity":1,"label":"package","optional":false},{"arity":1,"label":"dependency","optional":false}],"category":{"description":"Infrequently used commands","id":100},"description":"show why a package has another package in its closure","doc":"\n\n# Examples\n\n* Show one path through the dependency graph leading from Hello to\n  Glibc:\n\n  ```console\n  # nix why-depends nixpkgs#hello nixpkgs#glibc\n  /nix/store/v5sv61sszx301i0x6xysaqzla09nksnd-hello-2.10\n  └───bin/hello: …...................../nix/store/9l06v7fc38c1x3r2iydl15ksgz0ysb82-glibc-2.32/lib/ld-linux-x86-64.…\n      → /nix/store/9l06v7fc38c1x3r2iydl15ksgz0ysb82-glibc-2.32\n  ```\n\n* Show all files and paths in the dependency graph leading from\n  Thunderbird to libX11:\n\n  ```console\n  # nix why-depends --all nixpkgs#thunderbird nixpkgs#xorg.libX11\n  /nix/store/qfc8729nzpdln1h0hvi1ziclsl3m84sr-thunderbird-78.5.1\n  ├───lib/thunderbird/libxul.so: …6wrw-libxcb-1.14/lib:/nix/store/adzfjjh8w25vdr0xdx9x16ah4f5rqrw5-libX11-1.7.0/lib:/nix/store/ssf…\n  │   → /nix/store/adzfjjh8w25vdr0xdx9x16ah4f5rqrw5-libX11-1.7.0\n  ├───lib/thunderbird/libxul.so: …pxyc-libXt-1.2.0/lib:/nix/store/1qj29ipxl2fyi2b13l39hdircq17gnk0-libXdamage-1.1.5/lib:/nix/store…\n  │   → /nix/store/1qj29ipxl2fyi2b13l39hdircq17gnk0-libXdamage-1.1.5\n  │   ├───lib/libXdamage.so.1.1.0: …-libXfixes-5.0.3/lib:/nix/store/adzfjjh8w25vdr0xdx9x16ah4f5rqrw5-libX11-1.7.0/lib:/nix/store/9l0…\n  │   │   → /nix/store/adzfjjh8w25vdr0xdx9x16ah4f5rqrw5-libX11-1.7.0\n  …\n  ```\n\n* Show why Glibc depends on itself:\n\n  ```console\n  # nix why-depends nixpkgs#glibc nixpkgs#glibc\n  /nix/store/9df65igwjmf2wbw0gbrrgair6piqjgmi-glibc-2.31\n  └───lib/ld-2.31.so: …che       Do not use /nix/store/9df65igwjmf2wbw0gbrrgair6piqjgmi-glibc-2.31/etc/ld.so.cache.  --…\n      → /nix/store/9df65igwjmf2wbw0gbrrgair6piqjgmi-glibc-2.31\n  ```\n\n* Show why Geeqie has a build-time dependency on `systemd`:\n\n  ```console\n  # nix why-depends --derivation nixpkgs#geeqie nixpkgs#systemd\n  /nix/store/drrpq2fqlrbj98bmazrnww7hm1in3wgj-geeqie-1.4.drv\n  └───/: …atch.drv\",[\"out\"]),(\"/nix/store/qzh8dyq3lfbk3i1acbp7x9wh3il2imiv-gtk+3-3.24.21.drv\",[\"dev\"]),(\"/…\n      → /nix/store/qzh8dyq3lfbk3i1acbp7x9wh3il2imiv-gtk+3-3.24.21.drv\n      └───/: …16.0.drv\",[\"dev\"]),(\"/nix/store/8kp79fyslf3z4m3dpvlh6w46iaadz5c2-cups-2.3.3.drv\",[\"dev\"]),(\"/nix…\n          → /nix/store/8kp79fyslf3z4m3dpvlh6w46iaadz5c2-cups-2.3.3.drv\n          └───/: ….3.1.drv\",[\"out\"]),(\"/nix/store/yd3ihapyi5wbz1kjacq9dbkaq5v5hqjg-systemd-246.4.drv\",[\"dev\"]),(\"/…\n              → /nix/store/yd3ihapyi5wbz1kjacq9dbkaq5v5hqjg-systemd-246.4.drv\n  ```\n\n# Description\n\nNix automatically determines potential runtime dependencies between\nstore paths by scanning for the *hash parts* of store paths. For\ninstance, if there exists a store path\n`/nix/store/9df65igwjmf2wbw0gbrrgair6piqjgmi-glibc-2.31`, and a file\ninside another store path contains the string `9df65igw…`, then the\nlatter store path *refers* to the former, and thus might need it at\nruntime. Nix always maintains the existence of the transitive closure\nof a store path under the references relationship; it is therefore not\npossible to install a store path without having all of its references\npresent.\n\nSometimes Nix packages end up with unexpected runtime dependencies;\nfor instance, a reference to a compiler might accidentally end up in a\nbinary, causing the former to be in the latter's closure. This kind of\n*closure size bloat* is undesirable.\n\n`nix why-depends` allows you to diagnose the cause of such issues. It\nshows why the store path *package* depends on the store path\n*dependency*, by showing a shortest sequence in the references graph\nfrom the former to the latter. Also, for each node along this path, it\nshows a file fragment containing a reference to the next store path in\nthe sequence.\n\nTo show why derivation *package* has a build-time rather than runtime\ndependency on derivation *dependency*, use `--derivation`.\n\n","flags":{"all":{"arity":0,"category":"","description":"Show all edges in the dependency graph leading from *package* to *dependency*, rather than just a shortest path.","shortName":"a"},"arg":{"arity":2,"category":"Common evaluation options","description":"Pass the value *expr* as the argument *name* to Nix functions.","labels":["name","expr"]},"argstr":{"arity":2,"category":"Common evaluation options","description":"Pass the string *string* as the argument *name* to Nix functions.","labels":["name","string"]},"commit-lock-file":{"arity":0,"category":"Common flake-related options","description":"Commit changes to the flake's lock file."},"debugger":{"arity":0,"category":"Common evaluation options","description":"Start an interactive environment if evaluation fails."},"derivation":{"arity":0,"category":"Options that change the interpretation of installables","description":"Operate on the store derivation rather than its outputs."},"eval-store":{"arity":1,"category":"Common evaluation options","description":"The Nix store to use for evaluations.","labels":["store-url"]},"expr":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression *expr*.","labels":["expr"]},"file":{"arity":1,"category":"Options that change the interpretation of installables","description":"Interpret installables as attribute paths relative to the Nix expression stored in *file*. If *file* is the character -, then a Nix expression will be read from standard input. Implies `--impure`.","labels":["file"],"shortName":"f"},"impure":{"arity":0,"category":"Common evaluation options","description":"Allow access to mutable paths and repositories."},"include":{"arity":1,"category":"Common evaluation options","description":"Add *path* to the list of locations used to look up `<...>` file names.","labels":["path"],"shortName":"I"},"inputs-from":{"arity":1,"category":"Common flake-related options","description":"Use the inputs of the specified flake as registry entries.","labels":["flake-url"]},"no-registries":{"arity":0,"category":"Common flake-related options","description":"Don't allow lookups in the flake registries. This option is deprecated; use `--no-use-registries`."},"no-update-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not allow any updates to the flake's lock file."},"no-write-lock-file":{"arity":0,"category":"Common flake-related options","description":"Do not write the flake's newly generated lock file."},"override-flake":{"arity":2,"category":"Common evaluation options","description":"Override the flake registries, redirecting *original-ref* to *resolved-ref*.","labels":["original-ref","resolved-ref"]},"override-input":{"arity":2,"category":"Common flake-related options","description":"Override a specific flake input (e.g. `dwarffs/nixpkgs`). This implies `--no-write-lock-file`.","labels":["input-path","flake-url"]},"precise":{"arity":0,"category":"","description":"For each edge in the dependency graph, show the files in the parent that cause the dependency."},"recreate-lock-file":{"arity":0,"category":"Common flake-related options","description":"Recreate the flake's lock file from scratch."},"update-input":{"arity":1,"category":"Common flake-related options","description":"Update a specific flake input (ignoring its previous entry in the lock file).","labels":["input-path"]}}}},"description":"a tool for reproducible and declarative configuration management","doc":"\n\n# Examples\n\n* Create a new flake:\n\n  ```console\n  # nix flake new hello\n  # cd hello\n  ```\n\n* Build the flake in the current directory:\n\n  ```console\n  # nix build\n  # ./result/bin/hello\n  Hello, world!\n  ```\n\n* Run the flake in the current directory:\n\n  ```console\n  # nix run\n  Hello, world!\n  ```\n\n* Start a development shell for hacking on this flake:\n\n  ```console\n  # nix develop\n  # unpackPhase\n  # cd hello-*\n  # configurePhase\n  # buildPhase\n  # ./hello\n  Hello, world!\n  # installPhase\n  # ../outputs/out/bin/hello\n  Hello, world!\n  ```\n\n# Description\n\nNix is a tool for building software, configurations and other\nartifacts in a reproducible and declarative way. For more information,\nsee the [Nix homepage](https://nixos.org/) or the [Nix\nmanual](https://nixos.org/manual/nix/stable/).\n\n# Installables\n\nMany `nix` subcommands operate on one or more *installables*. These are\ncommand line arguments that represent something that can be built in\nthe Nix store. Here are the recognised types of installables:\n\n* **Flake output attributes**: `nixpkgs#hello`\n\n  These have the form *flakeref*[`#`*attrpath*], where *flakeref* is a\n  flake reference and *attrpath* is an optional attribute path. For\n  more information on flakes, see [the `nix flake` manual\n  page](./nix3-flake.md).  Flake references are most commonly a flake\n  identifier in the flake registry (e.g. `nixpkgs`), or a raw path\n  (e.g. `/path/to/my-flake` or `.` or `../foo`), or a full URL\n  (e.g. `github:nixos/nixpkgs` or `path:.`)\n\n  When the flake reference is a raw path (a path without any URL\n  scheme), it is interpreted as a `path:` or `git+file:` url in the following\n  way:\n  \n  - If the path is within a Git repository, then the url will be of the form\n    `git+file://[GIT_REPO_ROOT]?dir=[RELATIVE_FLAKE_DIR_PATH]`\n    where `GIT_REPO_ROOT` is the path to the root of the git repository,\n    and `RELATIVE_FLAKE_DIR_PATH` is the path (relative to the directory\n    root) of the closest parent of the given path that contains a `flake.nix` within\n    the git repository.\n    If no such directory exists, then Nix will error-out.\n    \n    Note that the search will only include files indexed by git. In particular, files\n    which are matched by `.gitignore` or have never been `git add`-ed will not be\n    available in the flake. If this is undesirable, specify `path:<directory>` explicitly;\n    \n    For example, if `/foo/bar` is a git repository with the following structure:\n    ```\n    .\n    └── baz\n        ├── blah\n        │   └── file.txt\n        └── flake.nix\n    ```\n\n  Then `/foo/bar/baz/blah` will resolve to `git+file:///foo/bar?dir=baz`\n\n  - If the supplied path is not a git repository, then the url will have the form\n    `path:FLAKE_DIR_PATH` where `FLAKE_DIR_PATH` is the closest parent\n    of the supplied path that contains a `flake.nix` file (within the same file-system).\n    If no such directory exists, then Nix will error-out.\n    \n    For example, if `/foo/bar/flake.nix` exists, then `/foo/bar/baz/` will resolve to\n   `path:/foo/bar`\n\n  If *attrpath* is omitted, Nix tries some default values; for most\n  subcommands, the default is `packages.`*system*`.default`\n  (e.g. `packages.x86_64-linux.default`), but some subcommands have\n  other defaults. If *attrpath* *is* specified, *attrpath* is\n  interpreted as relative to one or more prefixes; for most\n  subcommands, these are `packages.`*system*,\n  `legacyPackages.*system*` and the empty prefix. Thus, on\n  `x86_64-linux` `nix build nixpkgs#hello` will try to build the\n  attributes `packages.x86_64-linux.hello`,\n  `legacyPackages.x86_64-linux.hello` and `hello`.\n\n* **Store paths**: `/nix/store/v5sv61sszx301i0x6xysaqzla09nksnd-hello-2.10`\n\n  These are paths inside the Nix store, or symlinks that resolve to a\n  path in the Nix store.\n\n* **Store derivations**: `/nix/store/p7gp6lxdg32h4ka1q398wd9r2zkbbz2v-hello-2.10.drv`\n\n  Store derivations are store paths with extension `.drv` and are a\n  low-level representation of a build-time dependency graph used\n  internally by Nix. By default, if you pass a store derivation to a\n  `nix` subcommand, it will operate on the *output paths* of the\n  derivation. For example, `nix path-info` prints information about\n  the output paths:\n\n  ```console\n  # nix path-info --json /nix/store/p7gp6lxdg32h4ka1q398wd9r2zkbbz2v-hello-2.10.drv\n  [{\"path\":\"/nix/store/v5sv61sszx301i0x6xysaqzla09nksnd-hello-2.10\",…}]\n  ```\n\n  If you want to operate on the store derivation itself, pass the\n  `--derivation` flag.\n\n* **Nix attributes**: `--file /path/to/nixpkgs hello`\n\n  When the `-f` / `--file` *path* option is given, installables are\n  interpreted as attribute paths referencing a value returned by\n  evaluating the Nix file *path*.\n\n* **Nix expressions**: `--expr '(import <nixpkgs> {}).hello.overrideDerivation (prev: { name = \"my-hello\"; })'`.\n\n  When the `--expr` option is given, all installables are interpreted\n  as Nix expressions. You may need to specify `--impure` if the\n  expression references impure inputs (such as `<nixpkgs>`).\n\nFor most commands, if no installable is specified, the default is `.`,\ni.e. Nix will operate on the default flake output attribute of the\nflake in the current directory.\n\n## Derivation output selection\n\nDerivations can have multiple outputs, each corresponding to a\ndifferent store path. For instance, a package can have a `bin` output\nthat contains programs, and a `dev` output that provides development\nartifacts like C/C++ header files. The outputs on which `nix` commands\noperate are determined as follows:\n\n* You can explicitly specify the desired outputs using the syntax\n  *installable*`^`*output1*`,`*...*`,`*outputN*. For example, you can\n  obtain the `dev` and `static` outputs of the `glibc` package:\n\n  ```console\n  # nix build 'nixpkgs#glibc^dev,static'\n  # ls ./result-dev/include/ ./result-static/lib/\n  …\n  ```\n\n* You can also specify that *all* outputs should be used using the\n  syntax *installable*`^*`. For example, the following shows the size\n  of all outputs of the `glibc` package in the binary cache:\n\n  ```console\n  # nix path-info -S --eval-store auto --store https://cache.nixos.org 'nixpkgs#glibc^*'\n  /nix/store/g02b1lpbddhymmcjb923kf0l7s9nww58-glibc-2.33-123                 33208200\n  /nix/store/851dp95qqiisjifi639r0zzg5l465ny4-glibc-2.33-123-bin             36142896\n  /nix/store/kdgs3q6r7xdff1p7a9hnjr43xw2404z7-glibc-2.33-123-debug          155787312\n  /nix/store/n4xa8h6pbmqmwnq0mmsz08l38abb06zc-glibc-2.33-123-static          42488328\n  /nix/store/q6580lr01jpcsqs4r5arlh4ki2c1m9rv-glibc-2.33-123-dev             44200560\n  ```\n\n* If you didn't specify the desired outputs, but the derivation has an\n  attribute `meta.outputsToInstall`, Nix will use those outputs. For\n  example, since the package `nixpkgs#libxml2` has this attribute:\n\n  ```console\n  # nix eval 'nixpkgs#libxml2.meta.outputsToInstall'\n  [ \"bin\" \"man\" ]\n  ```\n\n  a command like `nix shell nixpkgs#libxml2` will provide only those\n  two outputs by default.\n\n* Otherwise, Nix will use all outputs of the derivation.\n\n# Nix stores\n\nMost `nix` subcommands operate on a *Nix store*.\n\nTODO: list store types, options\n\n","flags":{"accept-flake-config":{"arity":0,"category":"Options to override configuration settings","description":"Enable the `accept-flake-config` setting."},"access-tokens":{"arity":1,"category":"Options to override configuration settings","description":"Set the `access-tokens` setting.","labels":["value"]},"allow-dirty":{"arity":0,"category":"Options to override configuration settings","description":"Enable the `allow-dirty` setting."},"allow-import-from-derivation":{"arity":0,"category":"Options to override configuration settings","description":"Enable the `allow-import-from-derivation` setting."},"allow-new-privileges":{"arity":0,"category":"Options to override configuration settings","description":"Enable the `allow-new-privileges` setting."},"allow-symlinked-store":{"arity":0,"category":"Options to override configuration settings","description":"Enable the `allow-symlinked-store` setting."},"allow-unsafe-native-code-during-evaluation":{"arity":0,"category":"Options to override configuration settings","description":"Enable the `allow-unsafe-native-code-during-evaluation` setting."},"allowed-impure-host-deps":{"arity":1,"category":"Options to override configuration settings","description":"Set the `allowed-impure-host-deps` setting.","labels":["value"]},"allowed-uris":{"arity":1,"category":"Options to override configuration settings","description":"Set the `allowed-uris` setting.","labels":["value"]},"allowed-users":{"arity":1,"category":"Options to override configuration settings","description":"Set the `allowed-users` setting.","labels":["value"]},"auto-optimise-store":{"arity":0,"category":"Options to override configuration settings","description":"Enable the `auto-